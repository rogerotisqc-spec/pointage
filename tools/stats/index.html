<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Stats Pointage</title>
<meta name="theme-color" content="#1f5c45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stats Pointage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface2:#f8f5ee; --ink:#1c2420; --muted:#68716c; --line:#e2dccd;
  --brand:#1f5c45; --top:#1f5c45; --neg:#c0392b; --grid:#e9e4d8;
  --s-new:#2a78d6; --s-maj:#eb6834;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
    --brand:#5fbf95; --top:#173f31; --neg:#ff8a7a; --grid:#26302b;
    --s-new:#3987e5; --s-maj:#d95926;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
  --brand:#5fbf95; --top:#173f31; --neg:#ff8a7a; --grid:#26302b;
  --s-new:#3987e5; --s-maj:#d95926;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:var(--top);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:19px;line-height:1.2}
.top small{display:block;font-size:12.5px;opacity:.8;font-weight:400}
.top .grow{flex:1;min-width:0}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;font-size:20px}
.icon-btn:focus-visible{outline:2px solid #fff}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .v{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:4px}
.tile .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--brand);border:1.5px solid var(--brand)}
.hint{color:var(--muted);font-size:13px;margin:8px 4px}
.err{color:var(--neg);font-weight:600}
.login{max-width:420px;margin:40px auto}
.login h2{margin-top:0;font-size:18px;text-transform:none;letter-spacing:0;color:var(--ink)}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;margin-top:12px;padding:13px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn{color:#0d1a14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0d1a14}}
.link{all:unset;cursor:pointer;color:var(--brand);font-weight:600;font-size:13.5px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 4px 30px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="grow"><h1>Téléchargements</h1><small id="sub">App Pointage</small></div>
  <button class="icon-btn" id="refresh" aria-label="Actualiser" hidden>⟳</button>
</header>
<main id="main"></main>
<script>
const API = 'https://pointage-ia.rogerotisqc.workers.dev/stats';
const KEY_K = 'pointage.stats.key', DATA_K = 'pointage.stats.data', MODE_K = 'pointage.stats.mode', SPAN_K = 'pointage.stats.span';
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const fmt = n => n.toLocaleString('fr-CA');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null, MODE = store.get(MODE_K) === 'n' ? 'n' : 'u', SPAN = Number(store.get(SPAN_K)) || 30, OFFLINE = false, ERR = '';

function login(msg){
  $('refresh').hidden = true;
  $('main').innerHTML = `<div class="card login"><h2>Code du tableau de bord</h2>
    <p class="hint" style="margin:0 0 12px">C’est le code que vous avez mis dans Cloudflare (secret STATS_KEY). Il reste sur ce téléphone.</p>
    <form id="f"><input type="password" id="k" autocomplete="current-password" placeholder="Code" aria-label="Code">
    ${msg ? `<p class="err" style="margin:10px 0 0">${esc(msg)}</p>` : ''}
    <button class="btn" type="submit">Ouvrir</button></form></div>`;
  $('f').onsubmit = e => { e.preventDefault(); const k = $('k').value.trim(); if(!k) return; store.set(KEY_K, k); load(); };
  setTimeout(() => $('k') && $('k').focus(), 50);
}

async function load(){
  const key = store.get(KEY_K); if(!key) return login();
  $('refresh').hidden = false; $('refresh').classList.add('spin');
  try{
    const r = await fetch(API, { headers: { 'X-Stats-Key': key }, cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if(r.status === 403){ store.del(KEY_K); return login('Code refusé. Vérifiez-le et réessayez.'); }
    if(!r.ok) throw new Error(d.error || ('Erreur ' + r.status));
    d.at = Date.now(); DATA = d; OFFLINE = false; ERR = ''; store.set(DATA_K, JSON.stringify(d));
  }catch(e){
    const old = store.get(DATA_K); try{ DATA = old ? JSON.parse(old) : null; }catch(x){ DATA = null; }
    OFFLINE = true; ERR = e.message === 'Failed to fetch' ? 'Pas de connexion : derniers chiffres reçus.' : e.message;
  }finally{ $('refresh').classList.remove('spin'); }
  draw();
}

// Comparaison de versions « 6.10 » > « 6.9 »
const vcmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for(let i = 0; i < 3; i++){ const d = (x[i] || 0) - (y[i] || 0); if(d) return d; } return 0; };
function dayAdd(day, n){ const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
const DLONG = new Intl.DateTimeFormat('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' });
const DSHORT = new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short' });
const dlabel = (day, long) => (long ? DLONG : DSHORT).format(new Date(day + 'T12:00:00'));

function draw(){
  if(!DATA){ $('main').innerHTML = `<div class="card"><p class="err">${esc(ERR || 'Aucune donnée.')}</p><button class="btn" id="retry">Réessayer</button></div>`; $('retry').onclick = load; return; }
  const rows = DATA.rows || [], m = MODE, today = DATA.today || new Date().toISOString().slice(0, 10);
  $('sub').textContent = 'App Pointage' + (DATA.latest ? ' · version actuelle ' + DATA.latest : '');
  const sum = f => rows.filter(f).reduce((a, r) => a + r[m], 0);
  const from7 = dayAdd(today, -6), from30 = dayAdd(today, -29);
  const tot = sum(() => true), nNew = sum(r => r.kind === 'new'), nMaj = sum(r => r.kind === 'maj'), n7 = sum(r => r.day >= from7);
  const latestMaj = DATA.latest ? sum(r => r.ver === DATA.latest) : 0;
  const what = m === 'u' ? 'appareils' : 'téléchargements';

  // par version
  const vers = {}; rows.forEach(r => { const v = vers[r.ver] || (vers[r.ver] = {new: 0, maj: 0}); v[r.kind] += r[m]; });
  const vlist = Object.keys(vers).sort((a, b) => a === '?' ? 1 : b === '?' ? -1 : vcmp(b, a));

  $('main').innerHTML = `
    ${OFFLINE ? `<p class="hint err">${esc(ERR)}</p>` : ''}
    <div class="seg" role="group" aria-label="Façon de compter">
      <button data-m="u" aria-pressed="${m === 'u'}">Appareils uniques</button>
      <button data-m="n" aria-pressed="${m === 'n'}">Tous les téléchargements</button>
    </div>
    <div class="tiles">
      <div class="tile"><div class="v">${fmt(tot)}</div><div class="l">Total (${what})</div></div>
      <div class="tile"><div class="v">${fmt(nNew)}</div><div class="l"><span class="sw" style="background:var(--s-new)"></span>Nouvelles installations</div></div>
      <div class="tile"><div class="v">${fmt(nMaj)}</div><div class="l"><span class="sw" style="background:var(--s-maj)"></span>Mises à jour</div></div>
      <div class="tile"><div class="v">${fmt(n7)}</div><div class="l">7 derniers jours</div></div>
    </div>
    <h2>Par jour</h2>
    <div class="card">
      <div class="seg" role="group" aria-label="Période">${[30, 90].map(n => `<button data-span="${n}" aria-pressed="${SPAN === n}">${n} jours</button>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--s-new)"></i>Nouvelles installations</span><span><i style="background:var(--s-maj)"></i>Mises à jour</span></div>
      <div class="chart" id="chart"></div>
    </div>
    <h2>Par version</h2>
    <div class="card" style="padding:6px 12px">
      ${vlist.length ? `<table><thead><tr><th scope="col">Version</th><th scope="col">Nouvelles</th><th scope="col">Mises à jour</th><th scope="col">Total</th></tr></thead><tbody>
      ${vlist.map(v => `<tr><td>${v === '?' ? 'inconnue' : esc(v)}${v === DATA.latest ? '<span class="badge">actuelle</span>' : ''}</td><td>${fmt(vers[v].new)}</td><td>${fmt(vers[v].maj)}</td><td><b>${fmt(vers[v].new + vers[v].maj)}</b></td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">Aucun téléchargement compté pour l’instant.</p>'}
    </div>
    <p class="hint">« Appareils uniques » : un même appareil qui télécharge la même version plusieurs fois le même jour compte pour un. Les robots connus (aperçus de liens) ne sont pas comptés. L’app web n’est pas comptée (elle ne se télécharge pas).</p>
    <div class="foot"><span class="hint" style="margin:0">Chiffres reçus ${DATA.at ? new Date(DATA.at).toLocaleString('fr-CA', {dateStyle: 'medium', timeStyle: 'short'}) : ''}</span>
      <button class="link" id="forget">Oublier le code sur ce téléphone</button></div>`;

  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { MODE = b.dataset.m; store.set(MODE_K, MODE); draw(); });
  document.querySelectorAll('[data-span]').forEach(b => b.onclick = () => { SPAN = Number(b.dataset.span); store.set(SPAN_K, String(SPAN)); draw(); });
  $('forget').onclick = () => { store.del(KEY_K); store.del(DATA_K); DATA = null; login(); };
  chart(rows, today, m);
}

// Barres empilées par jour : nouvelles installations (bas) + mises à jour (haut)
function chart(rows, today, m){
  const box = $('chart'), N = SPAN, days = [];
  for(let i = N - 1; i >= 0; i--) days.push(dayAdd(today, -i));
  const by = {}; days.forEach(d => by[d] = {new: 0, maj: 0});
  rows.forEach(r => { if(by[r.day]) by[r.day][r.kind] += r[m]; });
  const W = Math.max(300, box.clientWidth || 600), H = 190, L = 30, R = 6, T = 10, B = 26;
  const pw = W - L - R, ph = H - T - B, step = pw / N, bw = Math.max(2, Math.min(18, step - (N > 60 ? 1 : 3)));
  const max = Math.max(1, ...days.map(d => by[d].new + by[d].maj));
  const nice = max <= 4 ? max : Math.ceil(max / (max > 20 ? 10 : max > 10 ? 5 : 2)) * (max > 20 ? 10 : max > 10 ? 5 : 2);
  const ticks = nice <= 4 ? Array.from({length: nice + 1}, (_, i) => i) : [0, nice / 2, nice].map(Math.round);
  const y = v => T + ph - v / nice * ph;
  const r = Math.min(4, bw / 2);
  // barre au sommet arrondi (côté données), base carrée sur l'axe
  const bar = (x, y0, y1, round) => { const h = y0 - y1; if(h <= 0) return ''; const rr = round ? Math.min(r, h) : 0;
    return `M${x},${y0}V${y1 + rr}${rr ? `Q${x},${y1} ${x + rr},${y1}H${x + bw - rr}Q${x + bw},${y1} ${x + bw},${y1 + rr}` : `H${x + bw}`}V${y0}Z`; };
  let g = '';
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`; });
  days.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2, a = by[d].new, b = by[d].maj, ya = y(a), yb = y(a + b);
    if(a) g += `<path d="${bar(x, y(0), ya, !b)}" fill="var(--s-new)"/>`;
    if(b) g += `<path d="${bar(x, a ? ya - 2 : y(0), yb, true)}" fill="var(--s-maj)"/>`;
    const lab = N <= 30 ? (i % 7 === (N - 1) % 7) : (i % 15 === (N - 1) % 15);
    if(lab) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${dlabel(d)}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${L + i * step}" y="${T}" width="${step}" height="${ph}" fill="transparent"/>`;
  });
  const total = days.reduce((s, d) => s + by[d].new + by[d].maj, 0);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Téléchargements par jour, ${N} derniers jours : ${total} en tout">${g}</svg><div class="tip" id="tip" role="status"></div>
    <div class="sr"><table><caption>Téléchargements par jour</caption><tr><th>Jour</th><th>Nouvelles</th><th>Mises à jour</th></tr>${days.map(d => `<tr><td>${d}</td><td>${by[d].new}</td><td>${by[d].maj}</td></tr>`).join('')}</table></div>`;
  const tip = $('tip'), svg = box.querySelector('svg');
  const show = el => { const i = Number(el.dataset.i), d = days[i], v = by[d], bb = svg.getBoundingClientRect(), k = bb.width / W;
    tip.innerHTML = `<b>${dlabel(d, true)}</b><br><i style="background:var(--s-new)"></i>Nouvelles : <b>${v.new}</b><br><i style="background:var(--s-maj)"></i>Mises à jour : <b>${v.maj}</b>`;
    const cx = (L + (i + .5) * step) * k; tip.style.left = Math.min(Math.max(cx, 80), bb.width - 80) + 'px'; tip.style.top = (y(v.new + v.maj) * k - 8) + 'px'; tip.classList.add('on');
    svg.querySelectorAll('.hit').forEach(h => h.setAttribute('fill', h === el ? 'color-mix(in srgb, var(--ink) 6%, transparent)' : 'transparent')); };
  svg.querySelectorAll('.hit').forEach(h => { h.addEventListener('pointerenter', () => show(h)); h.addEventListener('pointerdown', () => show(h)); });
  svg.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse'){ tip.classList.remove('on'); svg.querySelectorAll('.hit').forEach(h => h.setAttribute('fill', 'transparent')); } });
}

$('refresh').onclick = load;
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => DATA && draw(), 150); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && store.get(KEY_K)) load(); });
load();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
