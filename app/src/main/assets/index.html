  scrDone: () => { const g = curGame(), st = scrState(), tt = scrTurnTotal(); if(tt <= 0) return;

  scrSimple: () => { const g = curGame(); const v = num($('scrPts').value); const bingo = $('scrBingoS').checked; const tot = v + (bingo ? 50 : 0);
    if(!$('scrPts').value.trim() && !bingo) return toast('Inscrivez les points du tour, ou touchez « Passer »');
    scrNext(g, {pk: g.players[g.cur].key, pts: tot, note: bingo ? fmt(v) + ' + Scrabble 50' : '', t: Date.now()}); const n = $('scrPts'); if(n) n.focus(); },
  scrPass: () => { const g = curGame(); scrNext(g, {pk: g.players[g.cur].key, pts: 0, note: 'Passe ou échange', t: Date.now()}); },
  scrEnd: () => scrEndModal(),
  scrEndOk: () => { const g = curGame(); const left = {}; g.players.forEach(p => left[p.key] = scrLeftVal(p.key));
    const out = g.players.filter(p => !$('scrLeft-' + p.key).value.trim()); const others = Object.values(left).reduce((a,b) => a + b, 0);
    g.players.forEach(p => { if(left[p.key]) g.turns.push({pk: p.key, pts: -left[p.key], note: 'Fin : lettres restantes ' + scrLetters($('scrLeft-'+p.key).value).join('') + ' (−' + left[p.key] + ')', t: Date.now()}); });
    if(out.length === 1 && others) g.turns.push({pk: out[0].key, pts: others, note: 'Fin : a vidé son chevalet (+' + others + ')', t: Date.now()});
    g.finished = true; g.updated = Date.now(); S.scr = null; closeModal(); save(); go('results'); },
  undo: () => histUndo(),

  import: () => doImport(),
  // dés
  fkDie: el => { if((S.dice||[]).length >= 6) return toast('6 dés maximum'); S.dice = (S.dice||[]).concat([Number(el.dataset.v)]); render(); },
  fkRm: el => { S.dice.splice(Number(el.dataset.i),1); render(); },
  fkClear: () => { S.dice = []; render(); },
  fkAddSel: () => { if(S.dice.length === 6 && S.dice.every(d => d === S.dice[0])) return fkSix(S.dice[0]); const g = curGame(); const c = [0,0,0,0,0,0,0]; S.dice.forEach(d => c[d]++); fkAdd(diceScore(c, g.opts.f).pts); },
  fkAddMan: () => { const v = num($('fk-man').value); if(!v) return; if(v < 0){ S.turn = Math.max(0, (S.turn||0) + v); recordHist(); return render(); } fkAdd(v); },
  fkResetTurn: () => { S.turn = 0; S.dice = []; recordHist(); render(); },
  fkCur: el => { const g = curGame(); if(g.finished) return; if(S.turn) return toast('Encaissez ou annulez le tour en cours d’abord'); g.cur = Number(el.dataset.i); S.dice = []; save(); render(); },
  fkBank: () => { const g = curGame(), f = g.opts.f, p = g.players[g.cur]; let pts = S.turn||0, note = '';
    if(pts <= 0) return;
    if(!isEntered(g, p.key) && pts < f.entry){ note = `${fmt(pts)} : pas assez pour entrer (${fmt(f.entry)})`; pts = 0; toast(p.name + ' n’entre pas encore'); }
    else if(!isEntered(g, p.key)) note = 'Entré !';
    g.turns.push({pk:p.key, pts, raw:S.turn, note, t:Date.now()}); fkNext(g);
    const e = endInfo(g); if(e) toast('🏁 ' + e); },
  fkFarkle: () => { const g = curGame(), f = g.opts.f, p = g.players[g.cur]; const tot = totals(g)[p.key];
    const c = [0,0,0,0,0,0,0]; (S.dice||[]).forEach(d => c[d]++);
    const scored = (S.turn||0) > 0 || diceScore(c, f).pts > 0; // des dés ont déjà compté pendant ce tour
    const pen = tot >= f.penFrom && !scored ? -f.pen : 0;
    g.turns.push({pk:p.key, pts:pen, raw:0, note: pen ? `Raté à ${fmt(tot)} : pénalité` : (S.turn ? `Raté, ${fmt(S.turn)} perdus${tot >= f.penFrom ? ' (pas de pénalité : des dés avaient compté)' : ''}` : 'Raté'), t:Date.now()});
    if(pen) toast(p.name + ' perd ' + fmt(f.pen));
    fkNext(g); },
  fkSixBtn: () => { const g = curGame(); confirmBox(g.players[g.cur].name + ' a tiré six dés identiques ? Il gagne la partie.', 'Victoire !', () => fkSix(0)); },
  fkUndo: () => { const g = curGame(); const x = g.turns.pop(); if(x.win){ delete g.winner; g.finished = false; } const i = g.players.findIndex(p => p.key === x.pk); if(i>=0) g.cur = i; S.turn = 0; S.dice = []; save(); render(); toast('Tour annulé'); }
};
function newPlayer(name, color){
  if(db.players.some(p => p.name.toLowerCase() === name.toLowerCase())){ toast(name + ' est déjà dans la liste'); return null; }
  const p = {id:uid(), name, color: color && !db.players.some(x=>x.color===color) ? color : PALETTE.find(c => !db.players.some(x => x.color === c)) || PALETTE[db.players.length % PALETTE.length]};
  db.players.push(p); save(); return p;
}
document.addEventListener('click', e => {

  const fn = A[el.dataset.a]; if(fn){ fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'liveVal' && S.live && S.live.g){ liveDraft(S.live, liveRoundKey(S.live.g)).v = t.value; }
  if(t.id === 'mtManual' && M && M.mt){ const x = M.mt.v[M.mt.sel]; x.manual = t.value.trim() === '' ? null : Math.max(0, num(t.value)); const b = document.querySelector('.mtrow.on .mttot'); if(b) b.textContent = mtTotal(curGame(), x); }
  if(t.dataset && t.dataset.trrack && M && M.trEnd){ const g = curGame(), m = M.trEnd; m.rack[t.dataset.trrack] = Math.max(0, num(t.value)); const el = $('trEndTot'); if(el && m.who !== '') el.textContent = '+' + (25 + g.players.filter(p => p.key !== m.who).reduce((a, p) => a + (m.rack[p.key] || 0), 0)); }
  if(t.dataset && t.dataset.aqcash && M && M.aqf){ const g = curGame(); M.aqf.cash[t.dataset.aqcash] = num(t.value); const c = aqFinalCalc(g, M.aqf.cash); g.players.forEach(p => { const el = $('aqt-' + p.key); if(el) el.textContent = aqMoney(c.total[p.key]); }); }
  if(t.id === 'house'){ const v = t.value; if(v.trim()) db.house[t.dataset.hk] = v; else delete db.house[t.dataset.hk]; save(); }
  if(t.dataset && t.dataset.sb) sbUpdate();
  if(t.dataset && t.dataset.uno) unoUpdate();
  if(t.id === 'scrWord'){ const st = scrState(); st.word = t.value; st.marks = []; clearTimeout(window.__scrT); window.__scrT = setTimeout(() => { const pos = t.selectionStart; render(); const n = $('scrWord'); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }, 350); }
  if(t.dataset && t.dataset.scrleft){ const pk = t.id.slice(8); $('scrRest-' + pk).textContent = scrLeftVal(pk); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id && t.id.startsWith('liveX-') && S.live && S.live.g){ liveDraft(S.live, liveRoundKey(S.live.g)).x[t.id.slice(6)] = t.checked; render(); }
  if(t.name === 'sbw') sbUpdate();
  if(t.name === 'unow') unoUpdate();
  if(t.dataset && t.dataset.aqcash && M && M.aqf) aqFinalRender();
  if(t.id === 'mtOut' && M && M.mt){ const x = M.mt.v[M.mt.sel]; x.out = t.checked; if(t.checked){ M.mt.half = null; const nx = curGame().players.find(p => !M.mt.v[p.key].out && !M.mt.v[p.key].tiles.length && M.mt.v[p.key].manual == null); if(nx) M.mt.sel = nx.key; } mtRender(); }
  if(t.id === 'trBridge'){ trState().br = t.checked; render(); }

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id === 'guestName'){ e.preventDefault(); A.addGuest(); }
  else if(id === 'newPlayer'){ e.preventDefault(); A.addPlayer(); }
  else if(id === 'askQ'){ e.preventDefault(); A.askGo(); }
  else if(id === 'yzval'){ e.preventDefault(); A.yzSetInput(); }
  else if(id === 'liveVal'){ e.preventDefault(); e.target.blur(); liveSendScore(); }
  else if(id === 'liveYzVal'){ e.preventDefault(); A.liveYzInput(); }
  else if(id === 'pr'){ e.preventDefault(); A.promptOk(); }
  else if(id === 'fk-man'){ e.preventDefault(); A.fkAddMan(); }
  else if(id === 'scrWord'){ e.preventDefault(); clearTimeout(window.__scrT); render(); }
  else if(id === 'scr-man'){ e.preventDefault(); A.scrMan(); }
  else if(id === 'scrPts'){ e.preventDefault(); A.scrSimple(); }
  else if(e.target.closest && e.target.closest('#modal .num')){ // passe au champ suivant
    e.preventDefault(); const ins = [...document.querySelectorAll('#modal .num input')]; const i = ins.indexOf(e.target);
    if(i >= 0 && i < ins.length-1) ins[i+1].focus(); else e.target.blur(); }
});

/* ====================== Sauvegarde ====================== */
let wl = null;
async function wakeLock(on){
  try{
    if(on && !wl && navigator.wakeLock){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if(!on && wl){ await wl.release(); wl = null; }
  }catch(e){ wl = null; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && screenOnPref() && !bridge) wakeLock(true); });
function orientPref(){ try{ const v = localStorage.getItem('pointage.orient'); return v === 'portrait' || v === 'landscape' ? v : 'auto'; }catch(e){ return 'auto'; } }
function applyOrient(){
  const v = orientPref();
  if(bridge && bridge.setOrientation){ try{ bridge.setOrientation(v); }catch(e){} return; }
  try{ const so = screen.orientation; if(!so) return;
    if(v === 'auto'){ if(so.unlock) so.unlock(); }
    else if(so.lock){ const r = so.lock(v); if(r && r.catch) r.catch(() => {}); } }catch(e){}
}
function screenOnPref(){ try{ return localStorage.getItem('pointage.screenon') !== '0'; }catch(e){ return true; } }
async function doExport(){
  const name = 'pointage-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
  const data = JSON.stringify(db, null, 1);
  if(bridge && bridge.exportData){ bridge.exportData(data, name); return; }
  if(!window.claude){ // navigateur ordinaire (app web) : téléchargement direct
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Sauvegarde téléchargée'); return; }catch(e){}
  }
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use('downloads'); }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename: name, data}); toast('Sauvegarde enregistrée'); return; }
    catch(e){ if(e && e.code === 'declined') return toast('Exportation annulée'); }
  }
  // dernier recours : copier le texte
  openModal(`<div class="mhead"><h2>Copie de sauvegarde</h2><button class="icon-btn" data-a="close">✕</button></div>
    <div class="mbody"><p class="hint" style="margin-top:0">Copiez ce texte et collez-le dans une note ou un courriel. Pour le restaurer, enregistrez-le dans un fichier .json et utilisez « Importer ».</p>
    <textarea id="expTxt" class="field" readonly style="min-height:220px;font-size:12px">${esc(data)}</textarea></div>
    <div class="mfoot"><button class="btn primary" data-a="copyExp">Copier</button></div>`);
}
function doImport(){ if(bridge && bridge.importData){ bridge.importData(); return; } const i = $('importFile'); if(i) i.click(); }
window.onImportData = text => {
  let d; try{ d = JSON.parse(text); }catch(e){ return toast('Fichier illisible'); }
  if(!d || !d.v || !Array.isArray(d.games)) return toast('Ce n’est pas une sauvegarde de Pointage');
  confirmBox(`Remplacer les données actuelles par cette sauvegarde (${(d.players||[]).length} joueurs, ${d.games.length} parties) ?`, 'Remplacer', () => {
    db = Object.assign(defaultDb(), d); save(); tab('home'); toast('Sauvegarde importée'); }, true);
};
window.onExportDone = ok => toast(ok ? 'Sauvegarde enregistrée' : 'Exportation annulée');
function openUrl(u){ if(bridge && bridge.openUrl) bridge.openUrl(u); else window.open(u, '_blank'); }

let tt; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }

render(true);
applyOrient();
{ const lp = liveParse(location.hash); if(lp) liveJoin(lp); const sp = syncParse(location.hash); if(sp) setTimeout(() => syncJoinAsk(sp), 300); }

setTimeout(liveInboxLoop, 2000);

setTimeout(() => fbFlush(true), 2500);
