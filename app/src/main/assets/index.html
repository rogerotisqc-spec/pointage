<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f5c45">
<title>Pointage</title>
<style>
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface2:#f8f5ee; --ink:#1c2420; --muted:#68716c; --line:#e2dccd;
  --brand:#1f5c45; --brand-2:#2a7559; --on-brand:#ffffff; --accent:#d98e04; --danger:#c0392b; --ok:#2f7d4f;
  --lead:#fff4d6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --r:14px; --warn-bg:#fde8e4; --warn-line:#f3b4a8; --warn-ink:#a33;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
    --brand:#2f8a66; --brand-2:#3a9d76; --on-brand:#ffffff; --accent:#f0a91c; --danger:#e5604f; --ok:#4cb37b;
    --lead:#3a3216; --shadow:0 1px 2px rgba(0,0,0,.4);
    --warn-bg:#3d1f1b; --warn-line:#6b3229; --warn-ink:#f19a8b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
    --brand:#2f8a66; --brand-2:#3a9d76; --on-brand:#ffffff; --accent:#f0a91c; --danger:#e5604f; --ok:#4cb37b;
    --lead:#3a3216; --shadow:0 1px 2px rgba(0,0,0,.4);
    --warn-bg:#3d1f1b; --warn-line:#6b3229; --warn-ink:#f19a8b; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.num-t{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:14px 16px 12px;background:var(--brand);color:var(--on-brand)}
.top h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
.top .sub{margin:2px 0 0;font-size:13px;opacity:.8}
.top .grow{flex:1;min-width:0}
.top .grow h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn:disabled{opacity:.35}
.top .icon-btn.sm{width:36px}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border-radius:12px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:700;background:var(--surface)}
.mic.on{background:var(--brand);color:#fff;border-style:solid;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.heard{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.heard .bad{color:var(--danger)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.top .icon-btn:active{background:rgba(255,255,255,.15)}
.pad{padding:16px 16px 110px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;padding:14px 12px 12px;min-height:116px;display:flex;flex-direction:column;gap:8px;text-align:left}
.tile:active{transform:scale(.98)}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:none}
.tile h3{font-size:16px;font-weight:700}
.tile p{margin:0;font-size:12.5px;color:var(--muted)}
.tile .rules-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:var(--muted)}
.tile .rules-btn:active{background:var(--surface2)}
.resume{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.resume .grow{flex:1;min-width:0}
.resume .t{font-weight:700}
.resume .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:22px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.bottom button .i{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;min-height:56px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.chip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.chip.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.chip .x{margin-left:2px;color:var(--muted);font-size:18px}
.chip.guest{border-style:dashed}
.row{display:flex;gap:8px;align-items:center}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.field:focus{outline:none;border-color:var(--brand)}
textarea.field{padding:12px 14px;min-height:120px;resize:vertical}
label.lbl{display:block;font-size:14px;font-weight:600;margin:14px 2px 6px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.opts{padding:4px 14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
/* totals strip */
.scores{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.pscore{flex:1 0 96px;max-width:170px;padding:10px 10px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative}
.pscore.lead{background:var(--lead);border-color:var(--accent)}
.pscore .n{padding-right:24px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pscore .n i{width:9px;height:9px;border-radius:50%;flex:none}
.pscore .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.pscore .x{font-size:12px;color:var(--muted)}
.pscore .rk{position:absolute;top:8px;right:9px;font-size:12px;font-weight:800;color:var(--muted)}
.pscore.lead .rk{color:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table.sheet{border-collapse:collapse;width:100%;min-width:100%}
table.sheet th,table.sheet td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.sheet thead th{font-size:13px;padding:10px 8px;background:var(--surface2);font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis}
table.sheet th.lbl,table.sheet td.lbl{position:sticky;left:0;background:var(--surface2);text-align:left;padding:0 10px;font-size:13px;color:var(--muted);font-weight:600;z-index:1;border-right:1px solid var(--line)}
table.sheet td button{display:block;width:100%;min-width:64px;min-height:46px;padding:0 8px;font-size:17px;font-weight:600}
table.sheet td button:active{background:var(--surface2)}
table.sheet tfoot td{font-weight:800;font-size:17px;padding:10px 6px;background:var(--surface2);border-bottom:0}
table.sheet tfoot td.lbl{font-size:13px}
.neg{color:var(--danger)}
.tick{color:var(--ok);font-size:13px;margin-left:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--lead);border:1px solid var(--accent);display:flex;gap:10px;align-items:center}
.banner .grow{flex:1;font-weight:600;font-size:14.5px}
.banner.done{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok)}
/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.msheet{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;animation:up .2s ease-out}
.msheet.center{margin:auto 16px;border-radius:18px;max-height:80vh}
.modal-bg.c{align-items:center}
.mhead{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.mhead h2{flex:1;font-size:19px}
.mbody{overflow-y:auto;padding:0 16px 12px;flex:1}
.mfoot{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.mfoot .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.prow{padding:12px;margin-bottom:10px}
.prow .ph{display:flex;align-items:center;gap:10px}
.prow .ph .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;width:132px;flex:none}
.num:focus-within{border-color:var(--brand)}
.num input{width:100%;min-width:0;border:0;background:none;text-align:right;padding:0 12px;font-size:20px;font-weight:700;min-height:48px;font-variant-numeric:tabular-nums}
.num input:focus{outline:none}
.num .sign{width:40px;flex:none;font-weight:800;font-size:18px;color:var(--muted);border-right:1px solid var(--line);background:var(--surface2)}
.calc-t{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:16px;flex:none}
.calc-t.on{background:var(--brand);color:#fff;border-color:transparent}
.helper{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.helper.open{display:block}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:44px;min-height:42px;padding:0 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:15px}
.key:active{background:var(--line)}
.key.on{background:var(--brand);color:#fff;border-color:transparent}
.key.wide{flex:1 1 auto;white-space:nowrap}
.expr{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper b{min-width:22px;text-align:center;font-size:18px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .l{font-size:14.5px}
.line .l small{display:block;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.ptotal{font-size:22px;font-weight:800;color:var(--brand)}
.radio{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px;font-weight:700}
.radio input{width:22px;height:22px;accent-color:var(--brand)}
.radio:has(input:checked){border-color:var(--brand)}
/* lists */
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
/* rules */
.rules{padding:16px 18px;font-size:15.5px}
.rules h3{font-size:15px;margin:18px 0 6px;color:var(--brand)}
.rules h3:first-child{margin-top:0}
.rules p{margin:6px 0}
.rules ul,.rules ol{margin:6px 0;padding-left:22px}
.rules li{margin:4px 0}
.rules table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.rules td{padding:7px 4px;border-bottom:1px solid var(--line)}
.rules td:last-child{text-align:right;font-weight:700;white-space:nowrap}
/* farkle */
.fk-players .li.cur{background:var(--lead)}
.fk-players .li.cur .t::before{content:"▶ ";color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.turnbox{margin:12px 16px 0;padding:14px}
.turnbox .who{font-size:14px;color:var(--muted);font-weight:600}
.turnbox .who b{color:var(--ink);font-size:20px;display:block}
.turnpts{font-size:40px;font-weight:850;letter-spacing:-.03em;color:var(--brand);line-height:1.1}
.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.die{aspect-ratio:1;border-radius:12px;background:var(--surface);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16%;max-width:58px;width:100%;justify-self:center}
.die:active{transform:scale(.94)}
.die span{width:68%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die.sm{width:38px;height:38px;max-width:none;flex:none;border-width:1.5px;border-radius:8px;padding:5px}
.die.sm span{width:6px;height:6px}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;margin-top:10px;padding:6px;border-radius:12px;background:var(--surface2);border:1px dashed var(--line);align-items:center}
.tray .ph{font-size:13px;color:var(--muted);padding:0 6px}
.sel-v{font-size:14px;margin-top:8px;font-weight:600}
.log{margin:14px 16px 0}
.log .li{padding:9px 14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;transition:.2s;z-index:200;max-width:88vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.podium .li .rk{width:34px;font-size:22px;text-align:center}
.menu .li{font-weight:600}
.statt{width:100%;border-collapse:collapse}
.statt th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
.statt th:first-child,.statt td:first-child{text-align:left}
.statt td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.statt tr:last-child td{border-bottom:0}
.dealer{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--brand);text-align:left}
.dealer .ic{font-size:22px}.dealer .grow{flex:1;font-size:15px}.dealer .grow small{display:block;color:var(--muted);font-size:12px}
.dealer .chg{font-size:13px;color:var(--brand);font-weight:700}
.ptabs{display:flex;flex:none;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;padding:7px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-width:92px}
.ptab .n{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}.ptab .n i{width:9px;height:9px;border-radius:50%}
.ptab .v{font-size:17px;font-weight:800}
.ptab.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.crow .l{flex:1;min-width:0;font-size:15px;font-weight:600}.crow .l small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.crow .stepper b{min-width:26px}
.crow .stepper button:disabled{opacity:.35}
.crow .stepper button.plus{background:var(--brand);color:#fff;border-color:transparent}
.crow .pts{width:52px;text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.crow .pts.on{color:var(--ink)}
.pill{flex:none;padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;color:var(--muted);background:var(--surface2);white-space:nowrap}
.crow.on{border-color:var(--ok)}.crow.on .pill{background:var(--ok);color:#fff;border-color:transparent}
.crow .auto{font-size:11px;font-weight:700;color:var(--ok);margin-left:6px}
.crow.dis{opacity:.55}
.mbtot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--brand);margin:4px 0 8px;font-weight:800}
.mbtot b{font-size:24px;color:var(--brand)}
.warn-t{color:var(--danger);font-size:13px;margin:-2px 2px 8px}
table.sheet.compact{table-layout:fixed}
table.sheet.compact th.lbl{width:64px}
table.sheet.compact thead th{padding:9px 2px;font-size:12px;max-width:52px}
table.sheet.compact td button{min-width:0;padding:0 2px;font-size:16px}
table.sheet.compact th.lbl,table.sheet.compact td.lbl{padding:0 6px}
table.sheet.compact tfoot td{font-size:16px;padding:10px 2px}
table.sheet.compact tr.sub td{font-size:13px;padding:6px 2px}
table.sheet tr.sub td{background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted);padding:6px}
table.sheet tr.sub td.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
table.sheet tr.next td button{background:color-mix(in srgb,var(--brand) 7%,transparent)}
table.sheet td.empty-c{color:var(--line);height:46px}
.p9grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.p9c{aspect-ratio:3/4;max-height:74px;border-radius:9px;border:2px solid var(--line);background:var(--surface2);font-size:20px;font-weight:800;display:grid;place-items:center}
.p9c.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.p9c.f{background:var(--surface);border-color:var(--ink)}
.p9c.m{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok);color:var(--ok)}
.p10b{margin:12px 16px 0;padding:8px 6px 6px;overflow-x:auto}
table.p10{border-collapse:collapse;width:100%;table-layout:fixed}
table.p10 th{padding:2px 1px 6px;vertical-align:bottom}
table.p10 th.lc{width:96px}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid rgba(0,0,0,.15);display:block;margin:0 auto;box-shadow:var(--shadow)}
.sw-n{font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
table.p10 td{padding:0;border-top:1px solid var(--line);height:44px;text-align:center}
table.p10 td.ph{text-align:left;padding:0 6px;line-height:1.15}
table.p10 td.ph b{font-size:15px;margin-right:4px}
table.p10 td.ph small{font-size:11px;color:var(--muted)}
table.p10 tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 70%,transparent)}
table.p10 tr.fin td{border-top:2px solid var(--line)}
.p10c{width:100%;height:44px;display:grid;place-items:center}
.mk{width:30px;height:30px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.mk.big{width:44px;height:44px}
.done-dot{width:8px;height:8px;border-radius:50%;opacity:.45}
.nxt{width:24px;height:24px;border-radius:50%;border:2px dashed;opacity:.45}
.cpick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:6px 0 10px}
.cpick button{aspect-ratio:1;border-radius:14px;border:2px solid rgba(0,0,0,.15);position:relative}
.cpick button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.cpick button .who{position:absolute;bottom:3px;left:0;right:0;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj{text-align:center;padding:6px 4px 4px}
.obj .lvl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.obj h3{font-size:22px;margin:6px 0 4px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0 8px}
.cgroup{display:flex;gap:3px}
.pc{width:30px;height:44px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.chart .ax{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .tgt{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:700}
.chart .xh{stroke:var(--ink);stroke-width:1;opacity:.35}
.ctip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;box-shadow:var(--shadow);min-width:120px;z-index:2}
.ctip .h{font-weight:700;margin-bottom:3px;color:var(--muted)}
.ctip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.ctip .r i{width:8px;height:8px;border-radius:50%;flex:none}
.ctip .r span{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stile{padding:10px 10px 9px}
.stile .k{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.stile .v{font-size:19px;font-weight:800;margin-top:4px;line-height:1.15;overflow-wrap:anywhere}
.rec .li{padding:10px 14px}
.rec .li .t{font-size:14.5px}
.statt td.p{cursor:pointer}
.switch{position:relative;width:52px;height:30px;border-radius:15px;background:var(--line);flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.switch.on{background:var(--brand)}
.switch.on::after{left:25px}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* ====================== Données ====================== */
const KEY = 'pointage.v1';
const bridge = window.AndroidBridge || null;
const P10_COLORS = ['#e03131','#f76707','#fcc419','#82c91e','#2b8a3e','#12b886','#22b8cf','#1c7ed6','#364fc7','#7048e8','#ae3ec9','#e64980','#8d5524','#868e96','#212529','#f8f9fa'];
const PALETTE = ['#2f7d4f','#1971c2','#c2255c','#e8590c','#7048e8','#0a8fb0','#b08900','#5c940d','#d6336c','#495057','#9c36b5','#1098ad'];
const FD = {target:25000, entry:1000, penFrom:20000, pen:1000, straight:1500, pairs:750, useStraight:true, usePairs:true};

function defaultDb(){ return {v:1, players:[], games:[], house:{}, farkle:{...FD}, lastSel:{}, titles:[]}; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.v) return Object.assign(defaultDb(), d); }catch(e){}
  return defaultDb();
}
let db = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Impossible d’enregistrer'); } recordHist(); autoBackupSoon(); }
/* Sauvegarde automatique : app Android (dossier choisi) ou navigateur d'ordinateur Chrome/Edge (dossier choisi) */
const abWeb = () => !bridge && !!window.showDirectoryPicker && !window.claude;
const canAutoBackup = () => !!(bridge && bridge.writeBackup && bridge.pickBackupFolder) || abWeb();
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('pointage', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const d = await idb(); await new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
let abDir = null, abNeedPerm = false;
if(abWeb()) idbGet('abDir').then(h => { abDir = h || null; if(S.view === 'settings') render(); });
function abInfo(){
  if(bridge){ try{ return JSON.parse(bridge.backupInfo()); }catch(e){ return {}; } }
  let last = 0; try{ last = Number(localStorage.getItem('pointage.ablast')) || 0; }catch(e){}
  return abDir ? {folder: abDir.name, last: last || undefined} : {};
}
function abOn(){ try{ return localStorage.getItem('pointage.autobackup') === '1'; }catch(e){ return false; } }
let abTimer = null;
function autoBackupSoon(){ if(!canAutoBackup() || !abOn()) return; clearTimeout(abTimer); abTimer = setTimeout(autoBackupNow, 8000); }
async function abWriteWeb(json, gesture){
  if(!abDir) return;
  let perm = await abDir.queryPermission({mode: 'readwrite'});
  if(perm !== 'granted' && gesture) perm = await abDir.requestPermission({mode: 'readwrite'});
  if(perm !== 'granted'){ if(!abNeedPerm){ abNeedPerm = true; render(); } return; }
  const wasPaused = abNeedPerm; abNeedPerm = false;
  const month = new Date().toISOString().slice(0, 7);
  for(const name of ['Pointage-sauvegarde.json', 'Pointage-sauvegarde-' + month + '.json']){
    const fh = await abDir.getFileHandle(name, {create: true}); const w = await fh.createWritable(); await w.write(json); await w.close();
  }
  try{ localStorage.setItem('pointage.ablast', String(Date.now())); }catch(e){}
  window.onBackupDone(true, '');
  if(wasPaused) render();
}
function autoBackupNow(gesture){
  clearTimeout(abTimer); abTimer = null;
  if(!canAutoBackup() || !abOn() || !abInfo().folder) return;
  const json = JSON.stringify(db, null, 1);
  if(bridge) bridge.writeBackup(json);
  else abWriteWeb(json, gesture).catch(() => window.onBackupDone(false, 'le dossier n’est plus accessible, choisissez-le de nouveau'));
}
async function abPickFolder(){
  if(bridge) return bridge.pickBackupFolder();
  try{ abDir = await window.showDirectoryPicker({id: 'pointage', mode: 'readwrite', startIn: 'documents'}); await idbSet('abDir', abDir); window.onBackupFolder(true); }
  catch(e){ if(e && e.name !== 'AbortError') toast('Impossible d’utiliser ce dossier'); }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && abTimer) autoBackupNow(); });
window.onBackupFolder = ok => { if(ok){ try{ localStorage.setItem('pointage.autobackup', '1'); }catch(e){} autoBackupNow(true); toast('Dossier choisi : sauvegarde automatique activée'); } else toast('Aucun dossier choisi'); render(); };
window.onBackupDone = (ok, msg) => { if(!ok) toast('Sauvegarde automatique impossible : ' + msg); if(S.view === 'settings') render(); };
function abPausedBanner(){
  return abWeb() && abOn() && abNeedPerm ? `<button class="banner" style="width:calc(100% - 32px);text-align:left" data-a="abResume"><div class="grow">💾 Sauvegarde automatique en pause : le navigateur demande votre accord</div><span class="btn sm primary">Autoriser</span></button>` : '';
}
function backupCard(){
  if(!canAutoBackup()) return `<p class="hint" style="margin:12px 0 0">La sauvegarde automatique est offerte dans l’app Android et dans Chrome ou Edge sur ordinateur. Ici, pensez à exporter de temps en temps.</p>`;
  const on = abOn(), info = abInfo();
  return `<div class="row" style="margin-top:14px;align-items:flex-start"><div style="flex:1"><b>Sauvegarde automatique</b><div class="hint" style="margin:2px 0 0">Une copie à jour est enregistrée dans un dossier de votre choix après chaque changement.</div></div>
      <button class="switch ${on && info.folder ? 'on' : ''}" data-a="abToggle" aria-label="Sauvegarde automatique"></button></div>
    ${on && info.folder ? `<p class="hint">📁 ${esc(info.folder)}${info.last ? ' · dernière copie : ' + esc(new Date(info.last).toLocaleString('fr-CA', {dateStyle:'medium', timeStyle:'short'})) : ''}</p>
      <div class="row"><button class="btn sm" style="flex:1" data-a="abNow">Sauvegarder maintenant</button><button class="btn sm" style="flex:1" data-a="abPick">Changer de dossier</button></div>
      <p class="hint">Fichier : <b>Pointage-sauvegarde.json</b> (toujours à jour), plus une copie par mois. Pour restaurer : « Importer une sauvegarde » et choisir ce fichier.${abWeb() ? ' À la réouverture de l’app, le navigateur peut redemander votre accord d’un clic.' : ''}</p>` : ''}`;
}
/* Annuler / rétablir : un historique par partie, alimenté à chaque changement enregistré */
const HIST = {};
function histSnap(g){ const c = Object.assign({}, g); delete c.updated; return JSON.stringify({g: c, turn: S.turn || 0}); }
function histFor(g){ if(!g) return null; if(!HIST[g.id]) HIST[g.id] = {u: [], r: [], last: histSnap(g)}; return HIST[g.id]; }
function recordHist(){
  if(!S || !S.gameId) return; const g = db.games.find(x => x.id === S.gameId); if(!g) return;
  const h = histFor(g), cur = histSnap(g);
  if(h.last !== cur){ h.u.push(h.last); if(h.u.length > 60) h.u.shift(); h.r = []; h.last = cur; }
}
function histApply(state){
  const st = JSON.parse(state), i = db.games.findIndex(x => x.id === S.gameId); if(i < 0) return;
  st.g.updated = Date.now(); db.games[i] = st.g; S.turn = st.turn || 0; S.dice = [];
  HIST[S.gameId].last = state;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  if(S.view !== 'sheet'){ S.view = 'sheet'; }
  render();
}
function histUndo(){ const g = curGame(), h = histFor(g); if(!h || !h.u.length) return; h.r.push(h.last); histApply(h.u.pop()); toast('↶ Action annulée'); }
function histRedo(){ const g = curGame(), h = histFor(g); if(!h || !h.r.length) return; h.u.push(h.last); histApply(h.r.pop()); toast('↷ Action rétablie'); }
function histBtns(g){ const h = histFor(g);
  return `<button class="icon-btn sm" data-a="undo" ${h.u.length?'':'disabled'} aria-label="Annuler">↶</button><button class="icon-btn sm" data-a="redo" ${h.r.length?'':'disabled'} aria-label="Rétablir">↷</button>`; }

const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-5);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n)||0; return (n<0?'−':'') + Math.abs(n).toLocaleString('fr-CA'); };
const num = v => { const s = String(v == null ? '' : v).replace(/[−–]/g,'-').replace(/[^\d-]/g,''); const neg = s.startsWith('-'); const d = parseInt(s.replace(/-/g,''),10); return isNaN(d) ? 0 : (neg ? -d : d); };
const initial = n => (String(n).trim()[0]||'?').toUpperCase();
const dateFr = ts => new Date(ts).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
const $ = id => document.getElementById(id);

/* ====================== Jeux ====================== */
const ORDER = ['generic','farkle','playnine','flip7','uno','skipbo','millebornes','phase10'];
const GAMES = {
  generic:    {name:'Pointage libre', color:'#4f5b57', badge:'✎',  desc:'N’importe quel jeu, vos règles', round:'Manche'},
  playnine:   {name:'Play Nine',      color:'#2b8a3e', badge:'9',  desc:'9 trous · le plus bas gagne', round:'Trou', low:true, helper:'playnine'},
  flip7:      {name:'Flip 7',         color:'#e8590c', badge:'7',  desc:'Premier à 200', round:'Manche', target:200, helper:'flip7'},
  uno:        {name:'Uno',            color:'#c92a2a', badge:'U',  desc:'Chacun ses cartes · le plus bas gagne', round:'Manche', target:500, low:true, helper:'uno'},
  skipbo:     {name:'Skip-Bo',        color:'#1864ab', badge:'SB', desc:'25 + 5 par carte · premier à 500', round:'Manche', target:500},
  millebornes:{name:'Mille Bornes',   color:'#d9a400', badge:'1000', desc:'Premier à 5 000', round:'Manche', target:5000},
  phase10:    {name:'Phase 10',       color:'#6741d9', badge:'10', desc:'10 phases · le moins de points', round:'Manche', low:true, helper:'phase10'},
  farkle:     {name:'Jeu de dés',   color:'#0b7285', badge:'⚄',  desc:'Entrée à 1 000 · partie à 25 000', round:'Tour'}
};
const PHASES = [
  'Deux brelans (2 × 3 identiques)',
  'Un brelan + une suite de 4',
  'Un carré (4 identiques) + une suite de 4',
  'Une suite de 7',
  'Une suite de 8',
  'Une suite de 9',
  'Deux carrés (2 × 4 identiques)',
  '7 cartes d’une même couleur',
  '5 identiques + 2 identiques',
  '5 identiques + 3 identiques'
];
const PHASE_SHORT = ['2 brelans','Brelan + suite de 4','Carré + suite de 4','Suite de 7','Suite de 8','Suite de 9','2 carrés','7 de même couleur','5 identiques + 2','5 identiques + 3'];
const PHASE_EX = [[[5,5,5],[9,9,9]],[[8,8,8],[3,4,5,6]],[[2,2,2,2],[6,7,8,9]],[[1,2,3,4,5,6,7]],[[3,4,5,6,7,8,9,10]],[[2,3,4,5,6,7,8,9,10]],
  [[4,4,4,4],[11,11,11,11]],[[1,4,6,7,9,11,12]],[[6,6,6,6,6],[2,2]],[[9,9,9,9,9],[3,3,3]]];
const PHASE_EXPL = ['Deux groupes de 3 cartes de même chiffre.','Trois cartes de même chiffre et 4 chiffres qui se suivent.','Quatre cartes de même chiffre et 4 chiffres qui se suivent.',
  '7 chiffres qui se suivent, couleurs mélangées.','8 chiffres qui se suivent, couleurs mélangées.','9 chiffres qui se suivent, couleurs mélangées.','Deux groupes de 4 cartes de même chiffre.',
  '7 cartes de la même couleur, n’importe quels chiffres.','Cinq cartes de même chiffre et deux autres de même chiffre.','Cinq cartes de même chiffre et trois autres de même chiffre.'];
function gameName(g){ return g.type === 'generic' ? (g.title || 'Pointage libre') : GAMES[g.type].name; }
function houseKey(type, title){ return type === 'generic' ? 'generic:' + (title||'').trim().toLowerCase() : type; }

/* ====================== Règles (résumés) ====================== */
function rulesHtml(type, g){
  const f = (g && g.opts && g.opts.f) || Object.assign({}, FD, db.farkle);
  switch(type){
  case 'playnine': return `
    <h3>But</h3><p>Avoir le moins de points possible après 9 trous (manches).</p>
    <h3>Mise en place</h3><p>Chaque joueur reçoit 8 cartes face cachée, placées en 2 rangées de 4. Chacun retourne 2 cartes de son choix.</p>
    <h3>Un tour</h3><ul>
      <li>Prendre la carte du dessus de la pioche ou de la défausse.</li>
      <li>Soit l’échanger contre une de ses 8 cartes (visible ou cachée) : la carte remplacée va à la défausse.</li>
      <li>Soit, si elle vient de la pioche, la défausser et retourner une de ses cartes cachées.</li></ul>
    <h3>Fin du trou</h3><p>Quand un joueur a toutes ses cartes visibles, chacun des autres joue un dernier tour, puis on retourne tout et on compte.</p>
    <h3>Pointage</h3><ul>
      <li>Chaque carte vaut son chiffre (0 à 12). La carte « Hole-in-One » vaut −5.</li>
      <li>Deux cartes identiques dans une même colonne s’annulent (0). Une paire de −5 vaut −10.</li>
      <li>Bonus pour des colonnes appariées avec le même chiffre : 2 colonnes = −10, 3 = −15, 4 = −20.</li></ul>`;
  case 'flip7': return `
    <h3>But</h3><p>Être le premier à atteindre 200 points.</p>
    <h3>Une manche</h3><ul>
      <li>Le donneur distribue une carte face visible à chacun.</li>
      <li>À son tour, chaque joueur actif choisit : une autre carte (« encore ») ou s’arrêter (« je reste ») et garder ses points.</li>
      <li>Recevoir un chiffre qu’on a déjà devant soi : éliminé de la manche, 0 point (sauf avec une Seconde chance).</li></ul>
    <h3>Cartes action</h3><ul>
      <li><b>Gel</b> : le joueur visé doit s’arrêter et encaisser ses points.</li>
      <li><b>Pige trois</b> : le joueur visé doit prendre 3 cartes d’affilée.</li>
      <li><b>Seconde chance</b> : se défausse avec un doublon pour rester en jeu.</li></ul>
    <h3>Flip 7</h3><p>Réunir 7 chiffres différents termine la manche sur-le-champ et donne 15 points de bonus.</p>
    <h3>Pointage</h3><ol>
      <li>Additionner ses cartes chiffres.</li><li>La carte ×2 double ce total (chiffres seulement).</li>
      <li>Ajouter les modificateurs (+2 à +10).</li><li>Ajouter 15 pour un Flip 7.</li></ol>
    <p>La calculatrice 🧮 de la feuille fait ce calcul pour vous.</p>`;
  case 'uno': return `
    <h3>But</h3><p>Se débarrasser de toutes ses cartes.</p>
    <h3>Déroulement</h3><ul>
      <li>7 cartes chacun ; on retourne une carte pour lancer la défausse.</li>
      <li>Jouer une carte de même couleur, même chiffre ou même symbole. Sinon, piger une carte (on peut la jouer si elle convient).</li>
      <li><b>+2</b> : le suivant pige 2 et passe son tour. <b>Inversion</b> : change le sens. <b>Passe</b> : le suivant passe son tour.</li>
      <li><b>Joker</b> : choisir la couleur. <b>Joker +4</b> : choisir la couleur, le suivant pige 4 et passe son tour.</li>
      <li>Dire « Uno ! » quand il ne reste qu’une carte, sinon on pige 2 cartes de pénalité.</li></ul>
    <h3>Pointage maison</h3><p>À la fin de la manche, chaque joueur compte les cartes qui lui restent en main :</p>
    <table><tr><td>Chiffres</td><td>valeur</td></tr><tr><td>+2, Inversion, Passe</td><td>20</td></tr><tr><td>Joker, Joker +4</td><td>50</td></tr></table>
    <p>Quand un joueur atteint ${fmt((g&&g.opts.target)||500)}, la partie se termine : <b>le plus bas gagne</b>.</p>
    <p class="hint">Règle officielle : le gagnant de la manche marque les points des cartes des autres, premier à 500.</p>`;
  case 'skipbo': return `
    <h3>But</h3><p>Être le premier à vider son talon (sa pile de départ).</p>
    <h3>Mise en place</h3><ul>
      <li>Talon de 30 cartes par joueur (2 à 4 joueurs) ou de 20 cartes (5 joueurs et plus), face cachée, la carte du dessus retournée.</li>
      <li>5 cartes en main. Le reste forme la pioche.</li></ul>
    <h3>Un tour</h3><ul>
      <li>Compléter sa main à 5 cartes.</li>
      <li>Au centre, jusqu’à 4 piles communes qui montent de 1 à 12. Une pile complétée est retirée.</li>
      <li>On joue sur ces piles depuis sa main, le dessus de son talon ou le dessus de ses défausses. Les cartes Skip-Bo sont des jokers.</li>
      <li>Si on vide sa main, on repige 5 cartes et on continue.</li>
      <li>Le tour se termine en déposant une carte sur une de ses 4 piles de défausse.</li></ul>
    <h3>Pointage officiel</h3><p>Le gagnant de la manche marque <b>25 points + 5 points par carte</b> restant dans le talon de chaque adversaire. Premier à ${fmt((g&&g.opts.target)||500)}.</p>`;
  case 'millebornes': return `
    <h3>But</h3><p>Parcourir exactement 1 000 km par manche. La partie se joue en ${fmt((g&&g.opts.target)||5000)} points. Souvent en équipes à 4 ou 6 joueurs (inscrivez l’équipe comme un joueur).</p>
    <h3>Un tour</h3><p>6 cartes en main. Piger une carte, puis en jouer ou en défausser une.</p>
    <h3>Les cartes</h3><ul>
      <li><b>Bornes</b> : 25, 50, 75, 100, 200 km. Pas plus de deux 200 km par manche.</li>
      <li>Il faut un <b>Feu vert</b> pour rouler.</li>
      <li><b>Attaques</b> (sur l’adversaire) → <b>parades</b> : Feu rouge → Feu vert ; Limite de vitesse (50 km max) → Fin de limite ; Panne d’essence → Essence ; Crevaison → Roue de secours ; Accident → Réparations.</li>

/* ====================== Calculs ====================== */
function totals(g){
  const t = {}; g.players.forEach(p => t[p.key] = 0);
  if(g.type === 'farkle') g.turns.forEach(x => { if(x.pk in t) t[x.pk] += x.pts; });
  else g.rounds.forEach(r => { for(const k in r.s) if(k in t) t[k] += Number(r.s[k])||0; });
  return t;
}
function phaseOf(g, pk){
  if(!g.ph){ // anciennes parties : phases déduites des manches
    g.ph = {}; g.players.forEach(p => { let n = 1; g.rounds.forEach(r => { if(r.m && r.m.done && r.m.done[p.key]) n++; }); g.ph[p.key] = n; });
  }
  return g.ph[pk] || 1;
}
function p10Board(g){
  const cmp = g.players.length >= 5;
  const head = g.players.map(p => `<th><button class="sw" data-a="p10color" data-k="${p.key}" style="background:${p.color}" aria-label="Couleur de ${esc(p.name)}"></button><div class="sw-n">${esc(p.name)}</div></th>`).join('');
  const cell = (p, n) => { const cur = phaseOf(g, p.key);
    let inner = '';
    if(n === cur) inner = `<span class="mk" style="background:${p.color}"></span>`;
    else if(n < cur) inner = `<span class="done-dot" style="background:${p.color}"></span>`;
    else if(n === cur + 1 && !g.finished) inner = `<span class="nxt" style="border-color:${p.color}"></span>`;
    return `<td><button class="p10c" data-a="p10cell" data-k="${p.key}" data-n="${n}" aria-label="${esc(p.name)} phase ${n}">${inner}</button></td>`; };
  let rows = '';
  for(let n = 1; n <= 10; n++) rows += `<tr><td class="ph"><b>${n}</b>${cmp ? '' : ''}<small>${PHASE_SHORT[n-1]}</small></td>${g.players.map(p => cell(p, n)).join('')}</tr>`;
  rows += `<tr class="fin"><td class="ph"><b>🏆</b><small>Phase 10 réussie</small></td>${g.players.map(p => cell(p, 11)).join('')}</tr>`;
  return `<div class="card p10b"><table class="p10"><thead><tr><th class="lc"><div class="hint" style="margin:0;text-align:left;font-weight:600">Touchez un carré pour la couleur</div></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:6px 18px 0">Touchez la case suivante (cercle pointillé) pour avancer un joueur ; touchez son marqueur pour voir son objectif.</p>`;
}
function p10Info(g, pk){
  const p = g.players.find(x => x.key === pk); const n = phaseOf(g, pk);
  const cols = ['#e03131','#1c7ed6','#2b8a3e','#f59f00'];
  let body;
  if(n > 10) body = `<div class="obj"><span class="mk big" style="background:${p.color};display:inline-block"></span><h3>Les 10 phases sont réussies !</h3></div>`;
  else {
    let ci = 0;
    const ex = PHASE_EX[n-1].map(gr => `<div class="cgroup">${gr.map(v => `<span class="pc" style="background:${n===8?cols[1]:cols[(ci++)%4]}">${v}</span>`).join('')}</div>`).join('');
    body = `<div class="obj"><span class="mk big" style="background:${p.color};display:inline-block"></span>
      <div class="lvl" style="margin-top:8px">${esc(p.name)} · Phase ${n} sur 10</div><h3>${PHASES[n-1]}</h3><p class="hint" style="margin:0">${PHASE_EXPL[n-1]}</p>
      <div class="cards">${ex}</div><p class="hint">Exemple. Un Joker peut remplacer n’importe quelle carte.</p>
      ${n < 10 ? `<p class="hint">Ensuite : phase ${n+1} · ${PHASES[n]}</p>` : `<p class="hint">C’est la dernière phase !</p>`}</div>`;
  }
  openModal(`<div class="mhead"><h2>Objectif</h2><button class="icon-btn" data-a="close">✕</button></div><div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn" data-a="close">Fermer</button>${n <= 10 && !g.finished ? `<button class="btn primary" data-a="p10adv" data-k="${pk}">Phase ${n} réussie ›</button>` : ''}</div>`);
}
function p10Set(g, pk, n){
  phaseOf(g, pk); g.ph[pk] = n; g.updated = Date.now(); save(); render();
  const p = g.players.find(x => x.key === pk);
  toast(n > 10 ? '🏆 ' + p.name + ' a réussi les 10 phases !' : p.name + ' passe à la phase ' + n);
}
function isLow(g){ return !!g.opts.low; }
function ranking(g){
  const t = totals(g);
  const arr = g.players.map(p => ({p, total:t[p.key], phase: g.type==='phase10' ? phaseOf(g,p.key) : 0}));
  const cmp = (a,b) => {
    if(g.winner && (a.p.key === g.winner) !== (b.p.key === g.winner)) return a.p.key === g.winner ? -1 : 1;
    if(g.type === 'phase10' && a.phase !== b.phase) return b.phase - a.phase;
    return isLow(g) ? a.total - b.total : b.total - a.total;
  };
  arr.sort(cmp);
  arr.forEach((x,i) => { x.rank = (i>0 && cmp(arr[i-1], x) === 0) ? arr[i-1].rank : i+1; });
  return arr;
}
function endInfo(g){
  const t = totals(g);
  if(g.type === 'phase10'){
    const w = g.players.filter(p => phaseOf(g,p.key) > 10);
    return w.length ? w.map(p=>p.name).join(', ') + ' a réussi la phase 10' : null;
  }
  if(g.opts.holes) return g.rounds.length >= g.opts.holes ? 'Les ' + g.opts.holes + ' trous sont joués' : null;
  const tg = g.type === 'farkle' ? g.opts.f.target : g.opts.target;
  if(g.type === 'farkle'){
    if(g.winner){ const w = g.players.find(p => p.key === g.winner); return (w ? w.name : '?') + ' a tiré six dés identiques'; }
    const r = g.players.filter(p => t[p.key] === tg);
    return r.length ? r.map(p=>p.name).join(', ') + ' arrive exactement à ' + fmt(tg) : null;
  }
  if(tg > 0){
    const r = g.players.filter(p => t[p.key] >= tg);
    if(r.length) return r.map(p=>p.name).join(', ') + (r.length>1?' ont':' a') + ' atteint ' + fmt(tg);
  }
  return null;
}
function diceScore(c, f){
  const n = c.reduce((a,b)=>a+b,0);
  if(!n) return {pts:0, ok:true};
  let pts = 0, ok = true;
  for(let i=1;i<=6;i++){
    const k = c[i];
    if(k >= 3) pts += (i===1 ? 1000 : i*100) * Math.pow(2, k-3);
    else if(k > 0){ if(i===1) pts += 100*k; else if(i===5) pts += 50*k; else ok = false; }
  }
  let special = -1;
  if(n === 6){
    if(f.useStraight && [1,2,3,4,5,6].every(i=>c[i]===1)) special = Math.max(special, f.straight);
    if(f.usePairs && [1,2,3,4,5,6].every(i=>c[i]===0||c[i]===2)) special = Math.max(special, f.pairs);
  }
  if(special >= 0 && (!ok || special > pts)) return {pts:special, ok:true};
  return {pts, ok};
}
const MB_KM = [25,50,75,100,200];
function mbKm(m){ m = m || {}; return MB_KM.some(v => m['c'+v] != null) ? MB_KM.reduce((a,v) => a + v*(m['c'+v]||0), 0) : (m.km||0); }
// valeur effective d'une prime (automatique sauf si l'utilisateur l'a forcée)
function mbFlag(m, f, others){
  if(m[f] === true || m[f] === false) return m[f];
  const km = mbKm(m);
  if(f === 'va') return km >= 1000;
  if(f === 's200') return mbFlag(m, 'va', others) && !(m.c200 > 0);
  if(f === 'cap') return mbFlag(m, 'va', others) && !!others && others.length > 0 && others.every(o => mbKm(o) === 0);
  return false;
}
function mbPts(m, others){
  m = m || {}; const b = m.b||0;
  if(m.v2 !== true) return (m.km||0) + 100*b + (b===4?300:0) + 300*(m.cf||0) + (m.va?400:0) + (m.ret?300:0) + (m.s200?300:0) + (m.cap?500:0);
  return mbKm(m) + 100*b + (b===4?300:0) + 300*(m.cf||0) + (mbFlag(m,'va',others)?400:0) + (m.al?200:0) + (m.ret?300:0)
       + (mbFlag(m,'s200',others)?300:0) + (mbFlag(m,'cap',others)?500:0);
}
function mbOthers(pk){ return Object.keys(M.mb).filter(k => k !== pk).map(k => M.mb[k]); }
function mbRender(){
  const g = curGame(); const pk = M.mbSel; const p = g.players.find(x => x.key === pk); const m = M.mb[pk]; const oth = mbOthers(pk);
  $('mb-tabs').innerHTML = g.players.map(x => `<button class="ptab ${x.key===pk?'on':''}" data-a="mbTab" data-k="${x.key}"><div class="n"><i style="background:${x.color}"></i>${esc(x.name)}</div><div class="v num-t">${fmt(mbPts(M.mb[x.key], mbOthers(x.key)))}</div></button>`).join('');
  const km = mbKm(m);
  const cnt = (f, label, sub, per, max) => { const n = m[f]||0;
    return `<div class="crow"><div class="l">${label}<small>${sub}</small></div><div class="stepper"><button data-a="mbC" data-f="${f}" data-d="-1" ${n<=0?'disabled':''}>−</button><b class="num-t">${n}</b><button class="plus" data-a="mbC" data-f="${f}" data-d="1" ${n>=max?'disabled':''}>+</button></div><div class="pts ${n?'on':''}">${fmt(n*per)}</div></div>`; };
  const tog = (f, label, sub, pts, auto) => { const on = auto ? mbFlag(m, f, oth) : !!m[f]; const forced = m[f] === true || m[f] === false;
    return `<button class="crow ${on?'on':''}" data-a="mbT" data-f="${f}"><div class="l">${label}${auto && !forced ? '<span class="auto">AUTO</span>' : ''}<small>${sub}</small></div><span class="pill">✓ +${pts}</span></button>`; };
  $('mb-body').innerHTML = `
    <h2 class="sec">Bornes parcourues · ${fmt(km)} km</h2>
    ${km > 1000 ? '<p class="warn-t">Plus de 1 000 km : vérifiez les cartes.</p>' : ''}
    ${MB_KM.map(v => cnt('c'+v, 'Borne ' + v, v + ' pts la carte' + (v===200?' · 2 au maximum':''), v, v===200?2:40)).join('')}
    <h2 class="sec">Bottes</h2>
    ${cnt('b', 'Bottes jouées', '100 pts chacune, coups fourrés inclus', 100, 4)}
    ${cnt('cf', 'dont coups fourrés', '300 pts de plus chacun', 300, m.b||0)}
    <div class="crow ${m.b===4?'on':''}"><div class="l">Les 4 bottes<span class="auto">AUTO</span><small>prime en plus des 4 bottes</small></div><span class="pill">✓ +300</span></div>
    <h2 class="sec">Fin de manche</h2>
    ${tog('va', 'Manche terminée', '1 000 bornes atteintes', 400, true)}
    ${tog('al', 'Allonge', '700 → 1 000 en partie à rallonge', 200, false)}
    ${tog('s200', 'Sans les 200', 'manche terminée sans carte 200 km', 300, true)}
    ${tog('cap', 'Capot', 'les adversaires n’ont aucune borne', 500, true)}
    ${tog('ret', 'Retardement', 'manche terminée après la fin de la pioche', 300, false)}
    <div class="mbtot"><span>Total de ${esc(p.name)}</span><b class="num-t">${fmt(mbPts(m, oth))}</b></div>
    <p class="hint">Les primes AUTO se cochent seules selon les cartes ; touchez-les pour forcer l’inverse.</p>`;
}
function f7Pts(h){
  if(h.bust) return 0;
  const s = h.nums.reduce((a,b)=>a+b,0);
  return s*(h.x2?2:1) + h.mods.reduce((a,b)=>a+b,0) + (h.bonus?15:0);
}

function dealerIdx(g){ const n = g.players.length; return (((g.dealer0||0) + g.rounds.length) % n + n) % n; }
function dealerName(g){ return (g.players[dealerIdx(g)] || {}).name || '?'; }
function dealerBanner(g){

}

let S = {view:'home', stack:[]};

function go(view, params){
  S.stack.push(snapshot());
  Object.assign(S, params||{}, {view});
  render(true);
}
function snapshot(){ const o = {}; for(const k in S) if(k!=='stack') o[k] = S[k]; return o; }
function tab(view){
  M = null; $('modal').innerHTML = '';
  S = {view, stack: view==='home' ? [] : [{view:'home'}]};
  render(true);
}
function back(){
  if(M){ closeModal(); return true; }
  if(S.stack.length){ const p = S.stack.pop(); const st = S.stack; S = Object.assign({}, p, {stack:st}); render(true); return true; }
  return false;
}
window.handleBack = () => back();

  const guests = preset ? preset.players.filter(p => p.guest).map(p => ({key:p.key, name:p.name})) : [];
  go('setup', {setupType:type, sel, guests, dealer:null, setupTitle: preset ? preset.title||'' : '', setupLow: preset ? !!preset.opts.low : false,
               setupOpts: preset ? JSON.parse(JSON.stringify(preset.opts)) : null});

function readSetupFields(){
  // conserve ce qui a été tapé avant un re-rendu
  const o = S.setupOpts = S.setupOpts || {};
  if($('o-title')) S.setupTitle = $('o-title').value;
  if($('o-target')) o.target = num($('o-target').value);
  if($('f-target')){
    o.f = {}; ['target','entry','penFrom','pen','straight','pairs'].forEach(k => o.f[k] = num($('f-'+k).value));
    o.f.useStraight = $('f-useStraight').checked; o.f.usePairs = $('f-usePairs').checked;
    S.fkOpen = $('f-target').closest('details').open;
  }
}
function startGame(){
  readSetupFields();
  const type = S.setupType, G = GAMES[type], o = S.setupOpts || {};
  if(type === 'skipbo' && S.sel.length < 2) return toast('Il faut au moins 2 joueurs');
  const players = S.sel.map(k => {
    const p = db.players.find(x => x.id === k);
    if(p) return {key:'p'+p.id, rid:p.id, name:p.name, color:p.color, guest:false};
    const gu = S.guests.find(x => x.key === k);
    return {key:gu.key, name:gu.name, color:'#868e96', guest:true};
  });
  // couleurs d'invités distinctes
  let gi = 0; players.forEach(p => { if(p.guest){ p.color = PALETTE[(db.players.length + gi++) % PALETTE.length]; } });
  if(type === 'phase10'){ const order = [0,7,4,2,9,1,11,5,10,3,12,6,8,13,14,15]; players.forEach((p,i) => p.color = P10_COLORS[order[i % order.length]]); }
  const opts = {low: type==='generic' ? !!S.setupLow : !!G.low};
  if(type === 'generic'){ opts.target = o.target || 0; }
  else if(type === 'playnine'){ opts.holes = 9; }
  else if(type === 'farkle'){ opts.f = Object.assign({}, FD, db.farkle, o.f||{}); db.farkle = Object.assign({}, opts.f); }
  else if(G.target){ opts.target = o.target || G.target; }
  const title = type === 'generic' ? (S.setupTitle||'').trim() : '';
  if(title && !db.titles.some(t => t.toLowerCase() === title.toLowerCase())) db.titles.unshift(title);
  db.lastSel[type] = S.sel.filter(k => db.players.some(p => p.id === k));
  const g = {id:uid(), type, title, created:Date.now(), updated:Date.now(), finished:false, players, rounds:[], turns:[], cur:0, opts,
             dealer0: Math.max(0, S.sel.indexOf(S.sel.includes(S.dealer) ? S.dealer : S.sel[0]))};
  db.games.push(g); save();
  S = {view:'sheet', gameId:g.id, stack:[{view:'home'}], turn:0, dice:[]};
  render(true);
}

function p9Table(g, t){
  const holes = g.opts.holes || 9; const run = {}; const cmp = g.players.length >= 5;
  const short = n => cmp && n.length > 7 ? n.slice(0,6) + '.' : n; g.players.forEach(p => run[p.key] = 0);
  let rows = '';
  for(let i = 0; i < holes; i++){
    const rd = g.rounds[i];
    if(rd){
      rows += `<tr><td class="lbl">⛳${cmp?'':' '}${i+1}</td>${g.players.map(p => { const v = rd.s[p.key]; run[p.key] += Number(v)||0;
        return `<td><button data-a="editRound" data-i="${i}" class="num-t ${v<0?'neg':''}">${v!=null?fmt(v):'–'}</button></td>`; }).join('')}</tr>`;
      if(i > 0 && i < holes - 1) rows += `<tr class="sub"><td class="lbl">${cmp ? 'S.-tot.' : 'Sous-total'}</td>${g.players.map(p => `<td class="num-t">${fmt(run[p.key])}</td>`).join('')}</tr>`;
    } else {
      const nx = i === g.rounds.length && !g.finished;
      rows += `<tr class="${nx?'next':''}"><td class="lbl">⛳ ${i+1}</td>${g.players.map(() => nx ? `<td><button data-a="addRound">+</button></td>` : `<td class="empty-c">·</td>`).join('')}</tr>`;
    }
  }
  return `<div class="tablewrap"><table class="sheet ${cmp?'compact':''}"><thead><tr><th class="lbl">Trou</th>${g.players.map(p=>`<th>${esc(short(p.name))}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td class="lbl">Total</td>${g.players.map(p=>`<td class="num-t ${t[p.key]<0?'neg':''}">${fmt(t[p.key])}</td>`).join('')}</tr></tfoot></table></div>`;
}

/* ---------- Commande vocale (jeu de dés) ---------- */
const VOICE_NUM = {un:1, une:1, uns:1, deux:2, trois:3, quatre:4, cinq:5, six:6};
function voiceAvailable(){ return !!((bridge && bridge.listen) || window.SpeechRecognition || window.webkitSpeechRecognition); }
function parseDiceSpeech(text){
  let t = String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const cmd = /encaiss/.test(t) ? 'bank' : (/\brate\b|\bfarkle\b|aucun de/.test(t) ? 'farkle' : (/ajout/.test(t) ? 'add' : (/effac|recommenc/.test(t) ? 'clear' : null)));
  t = t.replace(/[^a-z0-9 ]+/g, ' ').replace(/\b(et|plus|puis|avec)\b/g, ' | ');
  const groups = t.split('|').map(gp => {
    const out = [];
    gp.trim().split(/\s+/).forEach(w => {
      if(!w) return;
      if(VOICE_NUM[w]) out.push(VOICE_NUM[w]);
      else if(/^[1-6]+$/.test(w)) w.split('').forEach(d => out.push(+d));
      else if(/^\d+$/.test(w)) out.push(-1); // nombre impossible (0, 7, 8…)
    });
    return out;
  }).filter(gp => gp.length);
  if(groups.some(gp => gp.includes(-1))) return {dice: null, cmd};
  const dice = [];
  for(const gp of groups){
    if(gp.length === 2 && gp[0] >= 1){ for(let i = 0; i < gp[0]; i++) dice.push(gp[1]); }  // « trois cinq » = trois 5
    else gp.forEach(d => dice.push(d));                                                   // « un cinq cinq » = 1, 5, 5
  }
  if(dice.length > 6) return {dice: null, cmd};
  return {dice, cmd};
}
function voiceStart(){
  if(S.listening) return;
  if(bridge && bridge.listen){ S.listening = true; render(); bridge.listen(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return toast('Reconnaissance vocale non disponible ici');
  const rec = new SR(); rec.lang = 'fr-CA'; rec.maxAlternatives = 5; rec.interimResults = false;
  rec.onresult = e => { const alts = []; for(const a of e.results[0]) alts.push(a.transcript); window.onSpeech(JSON.stringify(alts)); };
  rec.onerror = e => window.onSpeechError(e.error === 'not-allowed' ? 'Autorisez le micro pour cette app' : (e.error === 'no-speech' ? 'Rien entendu' : 'Erreur du micro'));
  rec.onend = () => { if(S.listening){ S.listening = false; render(); } };
  S.listening = true; render();
  try{ rec.start(); }catch(e){ window.onSpeechError('Erreur du micro'); }
}
window.onSpeechError = msg => { S.listening = false; toast('🎤 ' + msg); render(); };
window.onSpeech = json => {
  S.listening = false;
  let alts = []; try{ alts = JSON.parse(json) || []; }catch(e){}
  const g = curGame(); if(!g || g.type !== 'farkle' || g.finished){ render(); return; }
  let pick = null, heard = alts[0] || '';
  for(const a of alts){ const r = parseDiceSpeech(a); if((r.dice && r.dice.length) || r.cmd){ pick = r; heard = a; break; } }
  S.heard = {text: heard, ok: !!pick};
  if(!pick){ render(); return; }
  if(pick.dice && pick.dice.length) S.dice = pick.dice;
  if(pick.cmd === 'clear'){ S.dice = []; render(); return; }
  if(pick.cmd === 'farkle' && !(pick.dice && pick.dice.length)){ S.heard.did = 'Raté'; return A.fkFarkle(); }
  if(pick.cmd === 'add' || pick.cmd === 'bank'){
    const c = [0,0,0,0,0,0,0]; (S.dice||[]).forEach(d => c[d]++);
    const sc = diceScore(c, g.opts.f);
    if(S.dice.length && !(S.dice.length === 6 && S.dice.every(d => d === S.dice[0])) && !sc.ok){ render(); return toast('Certains dés ne comptent pas : vérifiez'); }
    const cur = g.cur;
    if(S.dice.length) A.fkAddSel();
    if(pick.cmd === 'bank' && curGame().cur === cur && !curGame().finished && (S.turn||0) > 0) A.fkBank();
    return;
  }
  render();
};
function fkSix(v){
  const g = curGame(), p = g.players[g.cur];
  g.turns.push({pk:p.key, pts:0, raw:S.turn||0, win:true, note:`🎲 Six dés identiques${v?' ('+v+')':''} : victoire !`, t:Date.now()});
  g.winner = p.key; g.finished = true; g.updated = Date.now(); S.turn = 0; S.dice = []; save();
  toast('🎲 ' + p.name + ' gagne avec six dés identiques !'); go('results');
}
function fkAdd(pts){
  const g = curGame(), f = g.opts.f, p = g.players[g.cur];
  const tot = totals(g)[p.key], nt = (S.turn||0) + pts;
  if(isEntered(g, p.key) || tot + nt >= f.entry){
    if(tot + nt > f.target){
      g.turns.push({pk:p.key, pts:0, raw:nt, note:`Dépasse ${fmt(f.target)} (${fmt(tot + nt)}) : tour terminé, aucun point`, t:Date.now()});
      toast('⛔ ' + p.name + ' dépasserait ' + fmt(f.target) + ' : au suivant');
      return fkNext(g);
    }
  }
  S.turn = nt; S.dice = []; recordHist(); render();
}
function fkNext(g){ g.cur = (g.cur + 1) % g.players.length; S.turn = 0; S.dice = []; S.heard = null; g.updated = Date.now(); save(); render(); }

/* ---------- Graphique : évolution des scores ---------- */
function scoreSeries(g){
  // cumul par joueur : après chaque manche, ou après chacun de ses tours (jeu de dés)
  return g.players.map(p => {
    const pts = [0]; let c = 0;
    if(g.type === 'farkle') g.turns.forEach(x => { if(x.pk === p.key){ c += x.pts; pts.push(c); } });
    else g.rounds.forEach(r => { c += Number(r.s[p.key]) || 0; pts.push(c); });
    return {p, pts};
  });
}
function niceStep(range, n){ const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
let CH = {};
function chartHtml(g, id){
  const ser = scoreSeries(g); const n = Math.max(...ser.map(x => x.pts.length)) - 1;
  if(n < 1) return `<p class="hint">Le graphique apparaîtra après la première ${GAMES[g.type].round.toLowerCase()}.</p>`;
  const tgt = g.type === 'farkle' ? g.opts.f.target : (g.opts.target || 0);
  let lo = Math.min(0, ...ser.flatMap(x => x.pts)), hi = Math.max(0, ...ser.flatMap(x => x.pts));
  if(tgt && hi >= tgt * 0.6) hi = Math.max(hi, tgt);
  if(hi === lo) hi = lo + 10;
  const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 340, H = 210, L = 40, Rm = ser.length <= 4 ? 58 : 12, T = 10, B = 24;
  const x = i => L + (W - L - Rm) * (i / n), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let svg = '';
  for(let v = lo; v <= hi + 1e-9; v += step) svg += `<line class="grid" x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`;
  if(lo < 0) svg += `<line class="base" x1="${L}" x2="${W-Rm}" y1="${y(0)}" y2="${y(0)}"/>`;
  if(tgt && tgt <= hi) svg += `<line class="tgt" x1="${L}" x2="${W-Rm}" y1="${y(tgt)}" y2="${y(tgt)}"/><text class="ax" x="${L+4}" y="${y(tgt)-4}">objectif ${fmt(tgt)}</text>`;
  const xs = n <= 10 ? [...Array(n+1).keys()] : [0, ...[1,2,3,4].map(k => Math.round(n*k/4))];
  xs.forEach(i => { svg += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${i}</text>`; });
  ser.forEach(sr => { svg += `<polyline fill="none" stroke="${sr.p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${sr.pts.map((v,i) => x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
    const li = sr.pts.length - 1; svg += `<circle cx="${x(li)}" cy="${y(sr.pts[li])}" r="4" fill="${sr.p.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  if(ser.length <= 4){ // étiquettes directes en bout de ligne, décalées pour ne pas se chevaucher
    const ends = ser.map(sr => ({sr, yy: y(sr.pts[sr.pts.length-1]), xx: x(sr.pts.length-1)})).sort((a,b) => a.yy - b.yy);
    for(let i = 1; i < ends.length; i++) if(ends[i].yy - ends[i-1].yy < 13) ends[i].yy = ends[i-1].yy + 13;
    ends.forEach(e => { const nm = e.sr.p.name.length > 8 ? e.sr.p.name.slice(0,7) + '.' : e.sr.p.name; svg += `<text class="lbl" x="${e.xx + 7}" y="${e.yy + 4}">${esc(nm)}</text>`; });
  }
  svg += `<line id="${id}-xh" class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>`;
  svg += `<rect data-chart="${id}" x="${L}" y="0" width="${W-L-Rm}" height="${H}" fill="transparent"/>`;
  CH[id] = {g, ser, n, L, W, Rm, H, x};
  const legend = ser.length >= 2 ? `<div class="legend">${ser.map(sr => `<span><i style="background:${sr.p.color}"></i>${esc(sr.p.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des scores par ${GAMES[g.type].round.toLowerCase()}">${svg}</svg><div class="ctip" id="${id}-tip" hidden></div></div>${legend}
    <p class="hint" style="margin-top:6px">Axe horizontal : ${g.type === 'farkle' ? 'tours de chaque joueur' : GAMES[g.type].round.toLowerCase() + 's'}. Touchez le graphique pour voir les pointages.</p>`;
}
function chartHover(e){
  const rect = e.target.closest('rect[data-chart]'); if(!rect) return;
  const c = CH[rect.dataset.chart]; if(!c) return;
  const svg = rect.ownerSVGElement, bb = svg.getBoundingClientRect(), sx = (e.clientX - bb.left) * (c.W / bb.width);
  const i = Math.max(0, Math.min(c.n, Math.round((sx - c.L) / ((c.W - c.L - c.Rm) / c.n))));
  const xh = $(rect.dataset.chart + '-xh'); xh.setAttribute('x1', c.x(i)); xh.setAttribute('x2', c.x(i)); xh.setAttribute('visibility', 'visible');
  const tip = $(rect.dataset.chart + '-tip');
  const rows = c.ser.map(sr => ({sr, v: sr.pts[Math.min(i, sr.pts.length - 1)]})).sort((a,b) => isLow(c.g) ? a.v - b.v : b.v - a.v);
  tip.innerHTML = `<div class="h">${c.g.type === 'farkle' ? 'Tour ' : GAMES[c.g.type].round + ' '}${i}</div>` + rows.map(r => `<div class="r"><i style="background:${r.sr.p.color}"></i><span>${esc(r.sr.p.name)}</span><b class="num-t">${fmt(r.v)}</b></div>`).join('');
  tip.hidden = false; const px = c.x(i) * bb.width / c.W;
  tip.style.left = Math.max(0, Math.min(bb.width - tip.offsetWidth, px + (px > bb.width / 2 ? -tip.offsetWidth - 10 : 10))) + 'px';
}
document.addEventListener('pointermove', chartHover);
document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerleave', e => { if(e.target.matches && e.target.matches('rect[data-chart]')){ const id = e.target.dataset.chart; $(id+'-tip').hidden = true; $(id+'-xh').setAttribute('visibility','hidden'); } }, true);

/* ---------- Statistiques ---------- */
function statKey(g){ return g.type === 'generic' ? 'generic:' + (g.title||'Pointage libre') : g.type; }
function statLabel(k){ return k.startsWith('generic:') ? k.slice(8) : GAMES[k].name; }
function statGames(){
  const per = S.statP || 'all', now = Date.now();
  const from = per === 'year' ? now - 365*864e5 : (per === 'month' ? now - 30*864e5 : 0);
  return db.games.filter(g => g.finished && (g.updated || g.created) >= from).sort((a,b) => a.created - b.created);
}
function pkey(name){ return String(name).trim().toLowerCase(); }
function computeStats(gs){
  const st = {};
  const get = p => { const k = pkey(p.name); return st[k] = st[k] || {name:p.name, color:p.color, n:0, w:0, seq:[], vs:{}, games:{}}; };
  gs.forEach(g => {
    const r = ranking(g), winners = r.filter(x => x.rank === 1).map(x => x.p);
    r.forEach(x => {
      const s1 = get(x.p), won = x.rank === 1, gk = statKey(g);
      s1.n++; if(won) s1.w++; s1.seq.push(won); s1.color = x.p.color;
      s1.games[gk] = s1.games[gk] || {n:0, w:0}; s1.games[gk].n++; if(won) s1.games[gk].w++;
      if(!won) winners.forEach(wp => { const k = pkey(wp.name); s1.vs[k] = (s1.vs[k] || 0) + 1; });
    });
  });
  Object.values(st).forEach(s1 => {
    let best = 0, run = 0; s1.seq.forEach(w => { run = w ? run + 1 : 0; best = Math.max(best, run); });
    let cur = 0; for(let i = s1.seq.length - 1; i >= 0 && s1.seq[i]; i--) cur++;
    s1.best = best; s1.cur = cur;
    const nem = Object.entries(s1.vs).sort((a,b) => b[1] - a[1])[0];
    s1.nemesis = nem ? {name: (st[nem[0]] || {name: nem[0]}).name, n: nem[1]} : null;
    const fav = Object.entries(s1.games).sort((a,b) => b[1].w - a[1].w || b[1].n - a[1].n)[0];
    s1.fav = fav && fav[1].w ? statLabel(fav[0]) : null;
  });
  return st;
}
function recordsFor(gs){
  if(!gs.length) return [];
  const g0 = gs[0], low = isLow(g0) && g0.type !== 'phase10';
  let bestWin = null, margin = null, longest = null;
  gs.forEach(g => {
    const r = ranking(g); const w = r[0], second = r.find(x => x.rank > 1);
    if(!(g.winner)){ const v = w.total; if(!bestWin || (low ? v < bestWin.v : v > bestWin.v)) bestWin = {v, who: w.p.name, g}; }
    if(second){ const m = Math.abs(w.total - second.total); if(!margin || m > margin.v) margin = {v: m, who: w.p.name, g}; }
    const len = g.type === 'farkle' ? g.turns.length : g.rounds.length; if(!longest || len > longest.v) longest = {v: len, g};
  });
  const unit = g0.type === 'farkle' ? 'tours' : GAMES[g0.type].round.toLowerCase() + 's';
  const out = [];
  if(bestWin) out.push([low ? 'Meilleur pointage gagnant (le plus bas)' : 'Meilleur pointage gagnant', fmt(bestWin.v), bestWin.who + ' · ' + dateFr(bestWin.g.created)]);
  if(margin) out.push(['Plus grande avance', fmt(margin.v) + ' pts', margin.who + ' · ' + dateFr(margin.g.created)]);
  if(longest) out.push(['Partie la plus longue', longest.v + ' ' + unit, dateFr(longest.g.created)]);
  const sixes = gs.filter(g => g.winner).length; if(sixes) out.push(['Victoires aux six dés identiques', String(sixes), '']);
  return out;
}

const canUpdate = () => !!(bridge && bridge.checkUpdate && bridge.installUpdate);
const appVersion = () => { try{ return bridge && bridge.getVersion ? bridge.getVersion() : (window.WEB_VERSION || ''); }catch(e){ return ''; } };
let UP = {state:'idle'};
function verParts(v){ return String(v||'').replace(/^v/i,'').split('.').map(n => parseInt(n,10)||0); }
function newer(a, b){ const x = verParts(a), y = verParts(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d = (x[i]||0) - (y[i]||0); if(d) return d > 0; } return false; }
function checkUpdates(quiet){
  if(!canUpdate()) return;

  bridge.checkUpdate();
}
window.onUpdateInfo = text => {

    UP = {state:'available', latest: String(rel.version), notes: rel.notes || '', url: rel.apk, size: rel.size};

window.onUpdateProgress = pct => { UP.state = 'downloading'; UP.pct = pct; const b = $('upPct'); if(b){ b.style.width = pct + '%'; $('upTxt').textContent = pct < 100 ? 'Téléchargement… ' + pct + ' %' : 'Ouverture de l’installation…'; } else if(S.view === 'settings') render(); };
window.onUpdateError = msg => { const q = UP.quiet && UP.state === 'checking'; UP = Object.assign({}, UP, {state: q ? 'idle' : 'error', msg}); if(!q) render(); };

function p9Score(c){
  let pts = 0; const matched = {}; const parts = [];
  for(let i = 0; i < 4; i++){
    const a = c[i], b = c[i+4];

    else { if(a != null){ pts += a; parts.push(String(a)); } if(b != null){ pts += b; parts.push(String(b)); } }
  }
  let bonus = 0; for(const k in matched) if(matched[k] >= 2) bonus -= 5 * matched[k];
  return {pts: pts + bonus, bonus, parts, matched};
}
function p9Render(pk){

  $('p9g-'+pk).innerHTML = h.c.map((v,i) => `<button class="p9c ${i===h.sel?'sel':''} ${v!=null?'f':''} ${isM(i)?'m':''}" data-a="p9s" data-k="${pk}" data-i="${i}">${v==null?'':(v<0?'−5':v)}</button>`).join('');
  const filled = h.c.filter(v => v != null).length;

}
function sbUpdate(){

function f7Update(pk){

}
function saveRound(){
  const g = curGame(); const rd = {s:{}, m:{}};
  if(g.type === 'millebornes'){
    g.players.forEach(p => { const m = Object.assign({}, M.mb[p.key]); m.km = mbKm(m); rd.m[p.key] = m; rd.s[p.key] = mbPts(m, mbOthers(p.key)); });
  } else if(g.type === 'skipbo'){
    const w = (document.querySelector('input[name=sbw]:checked')||{}).value;
    if(!w) return toast('Choisissez le gagnant de la manche');

    g.players.forEach(p => { if(p.key !== w){ const n = Math.max(0, num($('sb-'+p.key).value)); rd.m.left[p.key] = n; sum += n; } });
    g.players.forEach(p => rd.s[p.key] = p.key === w ? 25 + 5*sum : 0);
  } else {
    if(g.type === 'phase10' && M.round !== null) rd.m = g.rounds[M.round].m || {};
    g.players.forEach(p => { rd.s[p.key] = num($('in-'+p.key).value); });
  }
  if(M.round !== null) g.rounds[M.round] = rd; else g.rounds.push(rd);
  const isNew = M.round === null;
  g.updated = Date.now(); save(); closeModal(); render();

  else if(isNew && !(g.opts.holes && g.rounds.length >= g.opts.holes)) toast('🃏 À ' + dealerName(g) + ' de brasser' + (g.type === 'phase10' ? ' · avancez les marqueurs' : ''));
}

function fbBuild(){
  const msg = $('fbMsg').value.trim(); if(!msg) return null;
  const name = $('fbName').value.trim(); try{ localStorage.setItem('pointage.fbname', name); }catch(e){}
  const {ctx, game} = fbContext(); const withGame = game && $('fbGame') && $('fbGame').checked;
  const type = M.fbType || 'anomalie';
  const first = msg.split('\n')[0]; const short = first.length > 70 ? first.slice(0, 67) + '…' : first;
  const title = (type === 'anomalie' ? '🐞 ' : '💡 ') + (ctx.jeu ? ctx.jeu + ' : ' : '') + short;
  const rows = [['Version', ctx.version], ['Appareil', ctx.appareil], ['Écran', ctx.ecran], ['Jeu', ctx.jeu], ['Avancement', ctx.avancement], ['Pointage', ctx.pointage], ['Date', ctx.date]]
    .filter(r => r[1]).map(r => `| ${r[0]} | ${String(r[1]).replace(/\|/g,'/')} |`).join('\n');
  let body = `**${type === 'anomalie' ? 'Anomalie' : 'Suggestion'}**${name ? ' signalée par **' + name + '**' : ''}\n\n${msg.split('\n').map(l => '> ' + l).join('\n')}\n\n| Contexte | |\n|---|---|\n${rows}\n`;
  if(withGame){
    const gj = JSON.stringify(game); body += `\n<details><summary>État de la partie (pour reproduire)</summary>\n\n\`\`\`json\n${gj.length > 50000 ? gj.slice(0, 50000) + '…' : gj}\n\`\`\`\n</details>\n`;
  }
  body += '\n_Envoyé depuis l’app Pointage._';
  return {id: uid(), title, body, labels: [type, 'depuis-app'], at: Date.now()};
}
async function fbPost(item){
  const key = fbKey(); if(!key) throw new Error('nokey');
  const payload = JSON.stringify({title: item.title, body: item.body, labels: item.labels});
  if(bridge && bridge.postIssue){
    return await new Promise((res, rej) => { fbWait[item.id] = {res, rej}; bridge.postIssue(item.id, FB_REPO, key, payload); setTimeout(() => { if(fbWait[item.id]){ delete fbWait[item.id]; rej(new Error('timeout')); } }, 30000); });
  }
  const r = await fetch(`https://api.github.com/repos/${FB_REPO}/issues`, {method:'POST', headers:{'Authorization':'Bearer ' + key, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, body: payload});
  if(!r.ok) throw new Error('http ' + r.status);
  return (await r.json()).number;
}
const fbWait = {};
window.onIssueResult = (id, ok, num) => { const w = fbWait[id]; if(!w) return; delete fbWait[id]; ok ? w.res(num) : w.rej(new Error(String(num))); };
let fbBusy = false;
async function fbFlush(quiet){
  if(fbBusy) return; const q = fbQueue(); if(!q.length) return;
  fbBusy = true; let sent = 0, last = null;
  while(q.length){
    try{ last = await fbPost(q[0]); q.shift(); fbSaveQueue(q); sent++; }
    catch(e){ break; }
  }
  fbBusy = false;
  if(sent && !quiet) toast(sent === 1 ? `Merci ! Rapport envoyé (n° ${last})` : `Merci ! ${sent} rapports envoyés`);
  else if(sent) toast(`${sent} rapport(s) en attente envoyé(s)`);
  if(!sent && !quiet) toast('Pas de connexion : le rapport sera envoyé plus tard');
  if(S.view === 'settings') render();
}

async function wakeLock(on){
  try{
    if(on && !wl && navigator.wakeLock){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if(!on && wl){ await wl.release(); wl = null; }
  }catch(e){ wl = null; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.view === 'sheet' && !bridge) wakeLock(true); });
async function doExport(){
  const name = 'pointage-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
  const data = JSON.stringify(db, null, 1);
  if(bridge && bridge.exportData){ bridge.exportData(data, name); return; }
  if(!window.claude){ // navigateur ordinaire (app web) : téléchargement direct
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Sauvegarde téléchargée'); return; }catch(e){}
  }
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use('downloads'); }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename: name, data}); toast('Sauvegarde enregistrée'); return; }
    catch(e){ if(e && e.code === 'declined') return toast('Exportation annulée'); }
  }
  // dernier recours : copier le texte
  openModal(`<div class="mhead"><h2>Copie de sauvegarde</h2><button class="icon-btn" data-a="close">✕</button></div>
    <div class="mbody"><p class="hint" style="margin-top:0">Copiez ce texte et collez-le dans une note ou un courriel. Pour le restaurer, enregistrez-le dans un fichier .json et utilisez « Importer ».</p>
    <textarea id="expTxt" class="field" readonly style="min-height:220px;font-size:12px">${esc(data)}</textarea></div>
    <div class="mfoot"><button class="btn primary" data-a="copyExp">Copier</button></div>`);
}
function doImport(){ if(bridge && bridge.importData){ bridge.importData(); return; } const i = $('importFile'); if(i) i.click(); }
window.onImportData = text => {
  let d; try{ d = JSON.parse(text); }catch(e){ return toast('Fichier illisible'); }
  if(!d || !d.v || !Array.isArray(d.games)) return toast('Ce n’est pas une sauvegarde de Pointage');
  confirmBox(`Remplacer les données actuelles par cette sauvegarde (${(d.players||[]).length} joueurs, ${d.games.length} parties) ?`, 'Remplacer', () => {
    db = Object.assign(defaultDb(), d); save(); tab('home'); toast('Sauvegarde importée'); }, true);
};
window.onExportDone = ok => toast(ok ? 'Sauvegarde enregistrée' : 'Exportation annulée');
function openUrl(u){ if(bridge && bridge.openUrl) bridge.openUrl(u); else window.open(u, '_blank'); }

let tt; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }

render(true);
setTimeout(() => fbFlush(true), 2500);
// vérification discrète, au plus une fois par jour
try{ const last = Number(localStorage.getItem('pointage.lastCheck')||0); if(canUpdate() && Date.now() - last > 20*3600*1000) setTimeout(() => checkUpdates(true), 1500); }catch(e){}
</script>
