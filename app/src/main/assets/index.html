<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f5c45">
<title>Pointage</title>
<style>
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface2:#f8f5ee; --ink:#1c2420; --muted:#68716c; --line:#e2dccd;
  --brand:#1f5c45; --brand-2:#2a7559; --on-brand:#ffffff; --accent:#d98e04; --danger:#c0392b; --ok:#2f7d4f;
  --lead:#fff4d6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --r:14px; --warn-bg:#fde8e4; --warn-line:#f3b4a8; --warn-ink:#a33;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
    --brand:#2f8a66; --brand-2:#3a9d76; --on-brand:#ffffff; --accent:#f0a91c; --danger:#e5604f; --ok:#4cb37b;
    --lead:#3a3216; --shadow:0 1px 2px rgba(0,0,0,.4);
    --warn-bg:#3d1f1b; --warn-line:#6b3229; --warn-ink:#f19a8b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#101412; --surface:#191f1c; --surface2:#1f2622; --ink:#ecf0ed; --muted:#97a19b; --line:#2b3430;
    --brand:#2f8a66; --brand-2:#3a9d76; --on-brand:#ffffff; --accent:#f0a91c; --danger:#e5604f; --ok:#4cb37b;
    --lead:#3a3216; --shadow:0 1px 2px rgba(0,0,0,.4);
    --warn-bg:#3d1f1b; --warn-line:#6b3229; --warn-ink:#f19a8b; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.num-t{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:14px 16px 12px;background:var(--brand);color:var(--on-brand)}
.top h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
.top .sub{margin:2px 0 0;font-size:13px;opacity:.8}
.top .grow{flex:1;min-width:0}
.top .grow h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn:disabled{opacity:.35}
.top .icon-btn.sm{width:36px}
.icon-btn.ask{position:relative;width:auto;min-width:42px;padding:0 3px}
.top .icon-btn.sm.ask{width:auto;min-width:36px}
.ludo{color:#ff4d4d;font:900 18px/1 'Inter Display','Inter',system-ui,sans-serif;letter-spacing:-.02em;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.top .icon-btn.sm .ludo{font-size:16px}
.icon-btn.ask .ludo{transform:translateY(-6px)}
.icon-btn.ask .ia-tag{bottom:2px;right:-3px}
#modal svg,.card button svg{display:block;width:100%;height:auto}
.ia-tag{position:absolute;right:-1px;bottom:3px;font:800 9px/1 system-ui,sans-serif;letter-spacing:.02em;padding:2px 3px;border-radius:5px;background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
@media (max-width:440px){ .top{gap:2px;padding-left:8px;padding-right:6px} .top>.icon-btn:first-child{width:36px} .top .icon-btn.sm{width:31px;font-size:18px} .top .grow{margin-left:2px} .top .grow h1{font-size:19px} }
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border-radius:12px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:700;background:var(--surface)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid color-mix(in srgb,var(--brand) 25%,transparent);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}
.mic.on{background:var(--brand);color:#fff;border-style:solid;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.heard{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.heard .bad{color:var(--danger)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.top .icon-btn:active{background:rgba(255,255,255,.15)}
.pad{padding:16px 16px 110px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(5,1fr);gap:14px}}
.tile{position:relative;padding:14px 12px 12px;min-height:116px;display:flex;flex-direction:column;gap:8px;text-align:left}
.tile:active{transform:scale(.98)}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:none}
.tile h3{font-size:16px;font-weight:700}
.tile p{margin:0;font-size:12.5px;color:var(--muted)}
.tile .rules-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:var(--muted)}
.tile .rules-btn:active{background:var(--surface2)}
.resume{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.resume .grow{flex:1;min-width:0}
.resume .t{font-weight:700}
.resume .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:22px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.bottom button .i{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;min-height:56px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.chip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.chip.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.chip .x{margin-left:2px;color:var(--muted);font-size:18px}
.chip.guest{border-style:dashed}
.row{display:flex;gap:8px;align-items:center}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.field:focus{outline:none;border-color:var(--brand)}
textarea.field{padding:12px 14px;min-height:120px;resize:vertical}
label.lbl{display:block;font-size:14px;font-weight:600;margin:14px 2px 6px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.opts{padding:4px 14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
/* totals strip */
.scores{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.pscore{flex:1 0 96px;max-width:170px;padding:10px 10px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative}
.pscore.lead{background:var(--lead);border-color:var(--accent)}
.pscore .n{padding-right:24px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pscore .n i{width:9px;height:9px;border-radius:50%;flex:none}
.pscore .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.pscore .x{font-size:12px;color:var(--muted)}
.pscore .rk{position:absolute;top:8px;right:9px;font-size:12px;font-weight:800;color:var(--muted)}
.pscore.lead .rk{color:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table.sheet{border-collapse:collapse;width:100%;min-width:100%}
table.sheet th,table.sheet td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.sheet thead th{font-size:13px;padding:10px 8px;background:var(--surface2);font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis}
table.sheet th.lbl,table.sheet td.lbl{position:sticky;left:0;background:var(--surface2);text-align:left;padding:0 10px;font-size:13px;color:var(--muted);font-weight:600;z-index:1;border-right:1px solid var(--line)}
table.sheet td button{display:block;width:100%;min-width:64px;min-height:46px;padding:0 8px;font-size:17px;font-weight:600}
table.sheet td button:active{background:var(--surface2)}
table.sheet tfoot td{font-weight:800;font-size:17px;padding:10px 6px;background:var(--surface2);border-bottom:0}
table.sheet tfoot td.lbl{font-size:13px}
.neg{color:var(--danger)}
.tick{color:var(--ok);font-size:13px;margin-left:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--lead);border:1px solid var(--accent);display:flex;gap:10px;align-items:center}
.banner .grow{flex:1;font-weight:600;font-size:14.5px}
.banner.done{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok)}
/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.msheet{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;animation:up .2s ease-out}
.msheet.center{margin:auto 16px;border-radius:18px;max-height:80vh}
.modal-bg.c{align-items:center}
.mhead{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.mhead h2{flex:1;font-size:19px}
.mbody{overflow-y:auto;padding:0 16px 12px;flex:1}
.mfoot{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.mfoot .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.prow{padding:12px;margin-bottom:10px}
.prow .ph{display:flex;align-items:center;gap:10px}
.prow .ph .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;width:132px;flex:none}
.num:focus-within{border-color:var(--brand)}
.num input{width:100%;min-width:0;border:0;background:none;text-align:right;padding:0 12px;font-size:20px;font-weight:700;min-height:48px;font-variant-numeric:tabular-nums}
.num input:focus{outline:none}
.num .sign{width:40px;flex:none;font-weight:800;font-size:18px;color:var(--muted);border-right:1px solid var(--line);background:var(--surface2)}
.calc-t{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:16px;flex:none}
.calc-t.on{background:var(--brand);color:#fff;border-color:transparent}
.helper{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.helper.open{display:block}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:44px;min-height:42px;padding:0 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:15px}
.key:active{background:var(--line)}
.key.on{background:var(--brand);color:#fff;border-color:transparent}
.key.wide{flex:1 1 auto;white-space:nowrap}
.expr{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper b{min-width:22px;text-align:center;font-size:18px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .l{font-size:14.5px}
.line .l small{display:block;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.ptotal{font-size:22px;font-weight:800;color:var(--brand)}
.radio{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px;font-weight:700}
.radio input{width:22px;height:22px;accent-color:var(--brand)}
.radio:has(input:checked){border-color:var(--brand)}
/* lists */
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
/* rules */
.rules{padding:16px 18px;font-size:15.5px}
.rules h3{font-size:15px;margin:18px 0 6px;color:var(--brand)}
.rules h3:first-child{margin-top:0}
.rules p{margin:6px 0}
.rules ul,.rules ol{margin:6px 0;padding-left:22px}
.rules li{margin:4px 0}
.rules table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.rules td{padding:7px 4px;border-bottom:1px solid var(--line)}
.rules td:last-child{text-align:right;font-weight:700;white-space:nowrap}
/* farkle */
.fk-players .li.cur{background:var(--lead)}
.fk-players .li.cur .t::before{content:"▶ ";color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.turnbox{margin:12px 16px 0;padding:14px}
.turnbox .who{font-size:14px;color:var(--muted);font-weight:600}
.turnbox .who b{color:var(--ink);font-size:20px;display:block}
.turnpts{font-size:40px;font-weight:850;letter-spacing:-.03em;color:var(--brand);line-height:1.1}
.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px, 1.5vw, 14px);margin-top:12px}
.die{aspect-ratio:1;border-radius:18%;background:var(--surface);border:2px solid var(--ink);padding:0;width:100%;max-width:clamp(48px, 13vw, 96px);justify-self:center;display:block;position:relative;overflow:hidden}
.die:active{transform:scale(.94)}
.die svg{display:block;width:100%;height:100%}
.die svg circle{fill:var(--ink)}
.die.sm{width:clamp(38px, 7vw, 56px);height:clamp(38px, 7vw, 56px);max-width:none;flex:none;border-width:1.5px}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;margin-top:10px;padding:6px;border-radius:12px;background:var(--surface2);border:1px dashed var(--line);align-items:center}
.tray .ph{font-size:13px;color:var(--muted);padding:0 6px}
.sel-v{font-size:14px;margin-top:8px;font-weight:600}
.log{margin:14px 16px 0}
.log .li{padding:9px 14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;transition:.2s;z-index:200;max-width:88vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.podium .li .rk{width:34px;font-size:22px;text-align:center}
.menu .li{font-weight:600}
.statt{width:100%;border-collapse:collapse}
.statt th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
.statt th:first-child,.statt td:first-child{text-align:left}
.statt td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.statt tr:last-child td{border-bottom:0}
.dealer{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--brand);text-align:left}
.dealer .ic{font-size:22px}.dealer .grow{flex:1;font-size:15px}.dealer .grow small{display:block;color:var(--muted);font-size:12px}
.dealer .chg{font-size:13px;color:var(--brand);font-weight:700}
.ptabs{display:flex;flex:none;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;padding:7px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-width:92px}
.ptab .n{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}.ptab .n i{width:9px;height:9px;border-radius:50%}
.ptab .v{font-size:17px;font-weight:800}
.ptab.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.mtrows{display:flex;flex-direction:column;gap:6px}
.mtrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.mtrow.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.mtrow .grow{flex:1;min-width:0}.mtrow .av{width:32px;height:32px;font-size:14px}.mtrow small{display:block;font-size:12px;color:var(--muted)}.mtrow .mttot{font-size:22px;min-width:40px;text-align:right}
.mtpad{margin-top:10px;padding:12px}
.mtchips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;margin:10px 0;align-items:center}
.mtd{display:inline-flex;align-items:center;height:34px;border-radius:7px;background:#fffdf8;border:2px solid #2b2b2b;color:#1c2420;font-weight:800;font-size:15px;cursor:pointer}
.mtd .mth{min-width:24px;text-align:center}.mtd i{width:2px;height:22px;background:#2b2b2b}
.mtd.pending{border-style:dashed;opacity:.75}
.mtnums{display:grid;gap:6px}
.mtnums button{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:800}
.mtnums button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}.mtnums button:disabled{opacity:.35}
.trpanel{margin:12px 16px 0;padding:14px}
.trtop{display:flex;gap:14px;align-items:center}
.trtri{width:96px;flex:none}.trtri polygon{fill:color-mix(in srgb,#6d4c41 10%,var(--surface));stroke:#6d4c41;stroke-width:4;stroke-linejoin:round}

<script>
'use strict';
/* ====================== Données ====================== */
const KEY = 'pointage.v1';
const bridge = window.AndroidBridge || null;
const P10_COLORS = ['#e03131','#f76707','#fcc419','#82c91e','#2b8a3e','#12b886','#22b8cf','#1c7ed6','#364fc7','#7048e8','#ae3ec9','#e64980','#8d5524','#868e96','#212529','#f8f9fa'];
const PALETTE = ['#2f7d4f','#1971c2','#c2255c','#e8590c','#7048e8','#0a8fb0','#b08900','#5c940d','#d6336c','#495057','#9c36b5','#1098ad'];
const FD = {target:25000, entry:1000, penFrom:20000, pen:1000, straight:1500, pairs:750, useStraight:true, usePairs:true};

function defaultDb(){ return {v:1, players:[], games:[], house:{}, farkle:{...FD}, lastSel:{}, titles:[]}; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.v) return Object.assign(defaultDb(), d); }catch(e){}
  return defaultDb();
}
let db = load();
function save(){ { const cg = !S.live && curGame(); if(cg && cg.inbox) liveInboxCheck(cg); } try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Impossible d’enregistrer'); } recordHist(); autoBackupSoon(); liveSoon(); if(!SYNC_SILENT) syncSoon(); }
/* Sauvegarde automatique : app Android (dossier choisi) ou navigateur d'ordinateur Chrome/Edge (dossier choisi) */
const abWeb = () => !bridge && !!window.showDirectoryPicker && !window.claude;
const canAutoBackup = () => !!(bridge && bridge.writeBackup && bridge.pickBackupFolder) || abWeb();
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('pointage', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const d = await idb(); await new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
let abDir = null, abNeedPerm = false;
if(abWeb()) idbGet('abDir').then(h => { abDir = h || null; if(S.view === 'settings') render(); });
function abInfo(){
  if(bridge){ try{ return JSON.parse(bridge.backupInfo()); }catch(e){ return {}; } }
  let last = 0; try{ last = Number(localStorage.getItem('pointage.ablast')) || 0; }catch(e){}
  return abDir ? {folder: abDir.name, last: last || undefined} : {};
}
function abOn(){ try{ return localStorage.getItem('pointage.autobackup') === '1'; }catch(e){ return false; } }
let abTimer = null;
function autoBackupSoon(){ if(!canAutoBackup() || !abOn()) return; clearTimeout(abTimer); abTimer = setTimeout(autoBackupNow, 8000); }
async function abWriteWeb(json, gesture){
  if(!abDir) return;
  let perm = await abDir.queryPermission({mode: 'readwrite'});
  if(perm !== 'granted' && gesture) perm = await abDir.requestPermission({mode: 'readwrite'});
  if(perm !== 'granted'){ if(!abNeedPerm){ abNeedPerm = true; render(); } return; }
  const wasPaused = abNeedPerm; abNeedPerm = false;

  if(!S || !S.gameId) return; const g = db.games.find(x => x.id === S.gameId); if(!g) return;

/* ====================== Calculs ====================== */
function totals(g){
  const t = {}; g.players.forEach(p => t[p.key] = 0);
  if(g.type === 'yahtzee'){ g.players.forEach(p => t[p.key] = yzParts(g, p.key).total); return t; }
  if(isTurnGame(g)) g.turns.forEach(x => { if(x.pk in t) t[x.pk] += x.pts; });
  else g.rounds.forEach(r => { for(const k in r.s) if(k in t) t[k] += Number(r.s[k])||0; });
  return t;
}
function phaseOf(g, pk){
  if(!g.ph){ // anciennes parties : phases déduites des manches
    g.ph = {}; g.players.forEach(p => { let n = 1; g.rounds.forEach(r => { if(r.m && r.m.done && r.m.done[p.key]) n++; }); g.ph[p.key] = n; });
  }
  return g.ph[pk] || 1;
}
function p10Board(g){
  const cmp = g.players.length >= 5;
  const head = g.players.map(p => `<th><button class="sw" data-a="p10color" data-k="${p.key}" style="background:${p.color}" aria-label="Couleur de ${esc(p.name)}"></button><div class="sw-n">${esc(p.name)}</div></th>`).join('');
  // Ligne 0 = Départ, lignes 1 à 10 = phase réussie, ligne 11 = les 10 phases réussies.
  // Marqueur plein : là où le joueur est rendu ; petits points : le chemin parcouru ; cercle pointillé : la phase à réussir.
  const cell = (p, n) => { const cur = phaseOf(g, p.key), at = p10At(cur);
    let inner = '';
    if(n === at) inner = `<span class="mk" style="background:${p.color}"></span>`;
    else if(n >= 1 && n < at) inner = `<span class="done-dot" style="background:${p.color}"></span>`;
    else if(n === cur && cur <= 10 && !g.finished) inner = `<span class="nxt" style="border-color:${p.color}"></span>`;
    const lbl = n === 0 ? 'départ' : n === 11 ? '10 phases réussies' : 'phase ' + n;
    return `<td><button class="p10c" data-a="p10cell" data-k="${p.key}" data-n="${n}" aria-label="${esc(p.name)} ${lbl}">${inner}</button></td>`; };

function isLow(g){ return !!g.opts.low; }
function ranking(g){
  const t = totals(g);
  const arr = g.players.map(p => ({p, total:t[p.key], phase: g.type==='phase10' ? phaseOf(g,p.key) : 0}));
  const cmp = (a,b) => {
    if(g.winner && (a.p.key === g.winner) !== (b.p.key === g.winner)) return a.p.key === g.winner ? -1 : 1;
    if(g.type === 'phase10' && a.phase !== b.phase) return b.phase - a.phase;
    return isLow(g) ? a.total - b.total : b.total - a.total;

  arr.sort(cmp);

}
function endInfo(g){

}
function diceScore(c, f){
  const n = c.reduce((a,b)=>a+b,0);
  if(!n) return {pts:0, ok:true};
  let pts = 0, ok = true;
  for(let i=1;i<=6;i++){
    const k = c[i];
    if(k >= 3) pts += (i===1 ? 1000 : i*100) * Math.pow(2, k-3);
    else if(k > 0){ if(i===1) pts += 100*k; else if(i===5) pts += 50*k; else ok = false; }
  }
  let special = -1;
  if(n === 6){
    if(f.useStraight && [1,2,3,4,5,6].every(i=>c[i]===1)) special = Math.max(special, f.straight);
    if(f.usePairs && [1,2,3,4,5,6].every(i=>c[i]===0||c[i]===2)) special = Math.max(special, f.pairs);
  }
  if(special >= 0 && (!ok || special > pts)) return {pts:special, ok:true};
  return {pts, ok};
}

}

      const nt = o.nteams || 2, tn = ['A','B','C'];
      const nameOf = k => (db.players.find(p => p.id === k) || S.guests.find(g => g.key === k) || {}).name || '?';

          ${S.sel.length ? `<div style="margin-top:10px">${S.sel.map((k, i) => { const cur = teamIdx(k, i, nt);
            return `<div class="line"><div class="l"><b>${esc(nameOf(k))}</b></div><div class="seg" style="width:${nt*58}px">${[...Array(nt).keys()].map(t => `<button data-a="setTeamOf" data-k="${k}" data-v="${t}" class="${cur===t?'on':''}">${tn[t]}</button>`).join('')}</div></div>`; }).join('')}</div>

      <p class="hint">${off ? 'Le joueur qui termine la manche marque la valeur des cartes des autres. Le premier à atteindre le total gagne.' : 'Chacun compte ses propres cartes. Quand un joueur atteint le total, le plus bas gagne.'}</p>` + opts; }

    ${type !== 'farkle' && type !== 'scrabble' && S.sel.length > 1 ? `<h2 class="sec">Premier à brasser</h2><div class="chips">${S.sel.map(k => {
        const nm = (db.players.find(p => p.id === k) || S.guests.find(g => g.key === k) || {}).name || '?';
        const on = (S.sel.includes(S.dealer) ? S.dealer : S.sel[0]) === k;
        return `<button class="chip ${on?'on':''}" data-a="setDealer0" data-k="${k}" style="padding-left:14px">${on?'🃏 ':''}${esc(nm)}</button>`; }).join('')}</div>
      <p class="hint">Ensuite, le brassage passe au joueur suivant, dans l’ordre choisi ci-dessus.</p>` : ''}

function teamIdx(k, i, nt){ const t = S.teamOf && S.teamOf[k]; return (t != null && t < nt) ? t : i % nt; }
function teamSummary(nt, nameOf){ const tn = ['A','B','C']; return [...Array(nt).keys()].map(t => 'Équipe ' + tn[t] + ' : ' + (S.sel.filter((k,i) => teamIdx(k,i,nt) === t).map(nameOf).join(' et ') || '—')).join(' · '); }
function readSetupFields(){
  // conserve ce qui a été tapé avant un re-rendu
  const o = S.setupOpts = S.setupOpts || {};
  if($('o-title')) S.setupTitle = $('o-title').value;
  if($('o-target')) o.target = num($('o-target').value);
  if($('o-wznoeven')) o.noEven = $('o-wznoeven').checked;
  if($('o-trstart')) o.startBonus = $('o-trstart').checked;
  if($('o-mtblank')) o.blank50 = $('o-mtblank').checked;
  if($('f-target')){
    o.f = {}; ['target','entry','penFrom','pen','straight','pairs'].forEach(k => o.f[k] = num($('f-'+k).value));
    o.f.useStraight = $('f-useStraight').checked; o.f.usePairs = $('f-usePairs').checked;
    S.fkOpen = $('f-target').closest('details').open;
  }
}
function startGame(){
  readSetupFields();
  const type = S.setupType, G = GAMES[type], o = S.setupOpts || {};
  if(type === 'skipbo' && S.sel.length < 2) return toast('Il faut au moins 2 joueurs');
  if(type === 'wizard' && (S.sel.length < 3 || S.sel.length > 6)) return toast('Wizard se joue de 3 à 6 joueurs');
  if(type === 'acquire' && (S.sel.length < 2 || S.sel.length > 6)) return toast('Acquire se joue de 2 à 6 joueurs');
  if(type === 'triomino' && S.sel.length < 2) return toast('Il faut au moins 2 joueurs');
  if(type === 'train' && S.sel.length < 2) return toast('Il faut au moins 2 joueurs');
  if(TEAM_GAMES.includes(type) && o.teams && S.sel.length < (o.nteams || 2)) return toast('Il faut au moins un joueur par équipe');
  const players = S.sel.map(k => {
    const p = db.players.find(x => x.id === k);
    if(p) return {key:'p'+p.id, rid:p.id, name:p.name, color:p.color, guest:false};
    const gu = S.guests.find(x => x.key === k);
    return {key:gu.key, name:gu.name, color:'#868e96', guest:true};
  });
  // couleurs d'invités distinctes
  let gi = 0; players.forEach(p => { if(p.guest){ p.color = PALETTE[(db.players.length + gi++) % PALETTE.length]; } });
  if(type === 'phase10'){ const order = [0,7,4,2,9,1,11,5,10,3,12,6,8,13,14,15]; players.forEach((p,i) => p.color = P10_COLORS[order[i % order.length]]); }
  const opts = {low: type==='generic' ? !!S.setupLow : !!G.low};
  if(type === 'generic'){ opts.target = o.target || 0; }
  else if(type === 'playnine'){ opts.holes = 9; }
  else if(type === 'scrabble'){ opts.simple = !!o.simple; }
  else if(type === 'wizard'){ opts.rounds = Math.floor(60 / S.sel.length); opts.noEven = !!o.noEven; }
  else if(type === 'train'){ opts.set = [9,12,15].includes(o.set) ? o.set : 12; opts.rounds = opts.set + 1; opts.blank50 = !!o.blank50; }
  else if(type === 'triomino'){ opts.target = o.target || 400; opts.startBonus = !!o.startBonus; }
  else if(type === 'acquire'){ opts.ed = AQ_EDS[o.ed] ? o.ed : (db.aqEd || 'classic'); db.aqEd = opts.ed; }
  else if(type === 'farkle'){ opts.f = Object.assign({}, FD, db.farkle, o.f||{}); db.farkle = Object.assign({}, opts.f); }
  else if(G.target){ opts.target = o.target || G.target; }
  if(type === 'uno'){ opts.mode = o.mode || db.unoMode || 'official'; opts.low = opts.mode === 'house'; db.unoMode = opts.mode; }
  const title = type === 'generic' ? (S.setupTitle||'').trim() : '';
  if(title && !db.titles.some(t => t.toLowerCase() === title.toLowerCase())) db.titles.unshift(title);
  db.lastSel[type] = S.sel.filter(k => db.players.some(p => p.id === k));
  const g = {id:uid(), type, title, created:Date.now(), updated:Date.now(), finished:false, players, rounds:[], turns:[], cur:0, opts,
             dealer0: Math.max(0, S.sel.indexOf(S.sel.includes(S.dealer) ? S.dealer : S.sel[0]))};
  if(TEAM_GAMES.includes(type) && o.teams){
    const nt = o.nteams || 2, tn = ['A','B','C'], teams = [], members = {};
    for(let t = 0; t < nt; t++){
      const mem = players.filter((p, i) => teamIdx(S.sel[i], i, nt) === t);
      if(!mem.length) return toast('Chaque équipe doit avoir au moins un joueur');
      const key = 'tm' + t; members[key] = mem;
      teams.push({key, name: mem.map(m => m.name).join(' et '), color: mem[0].color, team: tn[t]});
    }
    g.team = true; g.seat = players; g.members = members; g.players = teams;
  }
  if(type === 'acquire') aqState(g);
  if(type === 'triomino') g.cur = Math.max(0, Math.min(players.length - 1, g.dealer0 || 0));
  if(type === 'yahtzee'){ yzState(g); g.yz.cur = Math.max(0, Math.min(players.length - 1, g.dealer0 || 0)); }
  db.games.push(g); save();
  S = {view:'sheet', gameId:g.id, stack:[{view:'home'}], turn:0, dice:[]};
  render(true);
}

/* ---------- Feuille de pointage ---------- */

  if(g.type === 'acquire') return vAcquire(g);
  if(g.type === 'yahtzee') return vYahtzee(g);
  if(g.type === 'triomino') return vTriomino(g);
  const G = GAMES[g.type], r = ranking(g), t = totals(g);
  const byKey = {}; r.forEach(x => byKey[x.p.key] = x);
  const end = !g.finished && endInfo(g);
  const maxRounds = g.opts.holes || (g.type === 'train' ? g.opts.rounds : 0);
  const strip = `<div class="scores">${g.players.map(p => { const x = byKey[p.key];
    return `<div class="pscore ${x.rank===1 && (g.rounds.length) ?'lead':''}"><span class="rk">${g.rounds.length?(x.rank===1?'★':'#'+x.rank):''}</span>
      <div class="n"><i style="background:${p.color}"></i>${esc(p.name)}</div><div class="v num-t">${fmt(x.total)}</div>

      ${g.type==='playnine' && g.rounds.length ? `<div class="x">${x.rank===1?'En tête':'+' + fmt(x.total - r[0].total) + (g.players.length >= 5 ? '' : ' du meneur')}</div>`:''}</div>`; }).join('')}</div>`;
  let table;

    <tbody>${g.rounds.map((rd,i) => `<tr><td class="lbl">${g.type === 'train' ? `${i+1} <small>(double ${mtDouble(g, i)})</small>` : G.round + ' ' + (i+1)}</td>${g.players.map(p => {
        const v = rd.s[p.key]; const has = v !== undefined && v !== null;
        const tick = '';
        const extra = (g.type==='skipbo' || g.type==='uno' || g.type==='train') && rd.m && rd.m.w === p.key ? ' 🏁' : (g.type==='skyjo' && rd.m && rd.m.fin === p.key ? (rd.m.doubled ? ' <small class="neg">×2</small>' : ' 🏁') : '');
        return `<td><button data-a="editRound" data-i="${i}" class="num-t ${v<0?'neg':''}">${has?fmt(v):'–'}${tick}${extra}</button></td>`; }).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td class="lbl">Total</td>${g.players.map(p=>`<td class="num-t ${t[p.key]<0?'neg':''}">${fmt(t[p.key])}</td>`).join('')}</tr></tfoot></table></div>`;
  const legend = !g.rounds.length ? '' : g.type === 'skipbo' ? (g.team ? '🏁 : l’équipe qui a gagné la manche (un partenaire a vidé son talon).' : '🏁 : le joueur qui a vidé son talon et gagné la manche.')
    : g.type === 'uno' && g.rounds.some(rd => rd.m && rd.m.w) ? '🏁 : le joueur qui n’avait plus de cartes ; il marque les cartes des autres.'
    : g.type === 'skyjo' ? '🏁 : le joueur qui a terminé la manche · ×2 : son pointage a été doublé.'
    : g.type === 'train' ? '🏁 : le joueur qui a posé tous ses dominos (0 point). Touchez une manche pour la corriger.' : '';
  if(legend) table += `<p class="hint" style="margin:8px 18px 0">${legend}</p>`;

  return `${topbar(gameName(g), sub, histBtns(g) + `<button class="icon-btn sm" data-a="rules" data-t="${g.type}" aria-label="Règles">📖</button><button class="icon-btn sm ask" data-a="ask" data-t="${g.type}" aria-label="Ludo, l’assistant : poser une question">${askIcon()}</button><button class="icon-btn sm" data-a="menu" aria-label="Menu">⋮</button>`)}

function p9Table(g, t){
  const holes = g.opts.holes || 9; const run = {}; const cmp = g.players.length >= 5;
  const short = n => cmp && n.length > 7 ? n.slice(0,6) + '.' : n; g.players.forEach(p => run[p.key] = 0);
  let rows = '';
  for(let i = 0; i < holes; i++){
    const rd = g.rounds[i];
    if(rd){
      rows += `<tr><td class="lbl">⛳${cmp?'':' '}${i+1}</td>${g.players.map(p => { const v = rd.s[p.key]; run[p.key] += Number(v)||0;
        return `<td><button data-a="editRound" data-i="${i}" class="num-t ${v<0?'neg':''}">${v!=null?fmt(v):'–'}</button></td>`; }).join('')}</tr>`;
      if(i > 0 && i < holes - 1) rows += `<tr class="sub"><td class="lbl">${cmp ? 'S.-tot.' : 'Sous-total'}</td>${g.players.map(p => `<td class="num-t">${fmt(run[p.key])}</td>`).join('')}</tr>`;
    } else {
      const nx = i === g.rounds.length && !g.finished;
      rows += `<tr class="${nx?'next':''}"><td class="lbl">⛳ ${i+1}</td>${g.players.map(() => nx ? `<td><button data-a="addRound">+</button></td>` : `<td class="empty-c">·</td>`).join('')}</tr>`;
    }
  }
  return `<div class="tablewrap"><table class="sheet ${cmp?'compact':''}"><thead><tr><th class="lbl">Trou</th>${g.players.map(p=>`<th>${esc(short(p.name))}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td class="lbl">Total</td>${g.players.map(p=>`<td class="num-t ${t[p.key]<0?'neg':''}">${fmt(t[p.key])}</td>`).join('')}</tr></tfoot></table></div>`;
}

/* ---------- Dés (Farkle) ---------- */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
// Points dessinés en vectoriel : ils remplissent toujours le carré, quelle que soit sa taille
function dieHtml(v, cls, attrs){
  const pos = [26, 50, 74];
  const dots = PIPS[v].map(i => `<circle cx="${pos[i % 3]}" cy="${pos[Math.floor(i / 3)]}" r="10"/>`).join('');
  return `<button class="die ${cls||''}" ${attrs||''} aria-label="${v}"><svg viewBox="0 0 100 100" aria-hidden="true">${dots}</svg></button>`;
}
function isEntered(g, pk){ return g.turns.some(x => x.pk === pk && x.pts > 0); }

  const panel = g.finished ? '' : `<div class="card turnbox">

    ${!entered ? `<p class="hint" style="margin-top:6px">⚠ Pas encore entré : il faut ${fmt(f.entry)} points en un tour.</p>` : ''}

    ${t[cur.key] >= f.penFrom ? `<p class="hint" style="margin-top:6px">⚠ Zone de pénalité : un raté coûte ${fmt(f.pen)} ${turn ? '<b>sauf maintenant</b> (des dés ont déjà compté ce tour)' : 'si aucun dé ne compte ce tour'}.</p>` : ''}

    <div class="tray">${(S.dice||[]).length ? S.dice.map((v,i) => dieHtml(v, 'sm', `data-a="fkRm" data-i="${i}"`)).join('') : '<span class="ph">Touchez les dés gardés de ce lancer</span>'}</div>
    ${(S.dice||[]).length === 6 && S.dice.every(d => d === S.dice[0]) ? `<div class="sel-v" style="color:var(--ok)">🎲 Six dés identiques : victoire immédiate !</div>` : (S.dice||[]).length ? `<div class="sel-v">${sc.ok ? `Ces dés valent <b>${fmt(sc.pts)}</b>` : `<span class="neg">Certains dés ne comptent pas</span>${sc.pts?` (le reste vaut ${fmt(sc.pts)})`:''}`}</div>` : ''}
    ${voiceAvailable() ? `<button class="mic ${S.listening?'on':''}" data-a="voice">${S.listening ? '🎤 J’écoute…' : '🎤 Dire les dés'}</button>

/* ---------- Yahtzee ---------- */

const YZ_UP = [1, 2, 3, 4, 5, 6].map(n => ({id: 'u' + n, face: n, name: ['As', 'Deux', 'Trois', 'Quatre', 'Cinq', 'Six'][n - 1], hint: 'Total des ' + n}));

  {id: 'full', name: 'Full', hint: '3 + 2 pareils · 25'}, {id: 'ps', name: 'Petite suite', hint: '4 qui se suivent · 30'},
  {id: 'gs', name: 'Grande suite', hint: '5 qui se suivent · 40'}, {id: 'yz', name: 'Yahtzee', hint: '5 pareils · 50'},
  {id: 'chance', name: 'Chance', hint: 'Total des dés'}];

// Calculatrice et pointage (on garde l’argent papier). Prix : chart officiel (paliers 2, 3, 4, 5, 6-10, 11-20, 21-30, 31-40, 41+),
// +100 $ par gamme (économique, standard, luxe). Prime majoritaire = 10 × prix, minoritaire = 5 × prix.
const AQ_TIERS = ['Économique', 'Standard', 'Luxe'];
const AQ_EDS = {

    ['festival','Festival',1,'#2e8540'], ['imperial','Imperial',2,'#c2185b'], ['continental','Continental',2,'#00838f']] },
  ah2016: { name: 'Récente', full: 'Récente (Wizards / Avalon Hill 2016)', chains: [
    ['worldwide','Worldwide',0,'#7b4a2d'], ['sackson','Sackson',0,'#c0392b'], ['festival','Festival',1,'#2e8540'], ['imperial','Imperial',1,'#e65100'],
    ['american','American',1,'#2c5aa0'], ['continental','Continental',2,'#00838f'], ['tower','Tower',2,'#b58900']] },
  h2016: { name: 'Hasbro 2016', full: 'Hasbro 2016 (Spark, Nestor…)', chains: [
    ['spark','Spark',0,'#b58900'], ['nestor','Nestor',0,'#c0392b'], ['rove','Rove',1,'#2c5aa0'], ['fleet','Fleet',1,'#2e8540'],
    ['etch','Etch',1,'#6a1b9a'], ['echo','Echo',2,'#c2185b'], ['bolt','Bolt',2,'#00838f']] }
};
const AQ_SIZES = [['2',2],['3',3],['4',4],['5',5],['6 à 10',6],['11 à 20',11],['21 à 30',21],['31 à 40',31],['41 et +',41]];
function aqChains(g){ return (AQ_EDS[g.opts.ed] || AQ_EDS.classic).chains.map(([id, name, tier, color]) => ({id, name, tier, color})); }
function aqChain(g, id){ return aqChains(g).find(c => c.id === id); }
function aqPrice(tier, size){
  if(!size || size < 2) return 0;

  return (b + tier) * 100;
}
function aqState(g){
  if(!g.aq){ g.aq = {size:{}, sh:{}, log:[]}; }
  aqChains(g).forEach(c => { if(g.aq.size[c.id] == null) g.aq.size[c.id] = 0; if(!g.aq.sh[c.id]) g.aq.sh[c.id] = {}; });

}
function aqHeld(g, id, pk){ return (aqState(g).sh[id] || {})[pk] || 0; }

function aqUp100(x){ return Math.ceil(x / 100) * 100; }
// Primes d’une chaîne : égalité au 1er rang → (majoritaire + minoritaire) partagées ; seul actionnaire → les deux primes
function aqBonuses(g, id, size){
  const c = aqChain(g, id), price = aqPrice(c.tier, size == null ? aqState(g).size[id] : size);
  const maj = price * 10, min = price * 5, out = {};
  const hold = g.players.map(p => ({pk: p.key, n: aqHeld(g, id, p.key)})).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  if(!hold.length || !price) return {maj, min, pay: out, roles: {}};
  const roles = {};
  const top = hold.filter(x => x.n === hold[0].n);
  if(top.length > 1){ const each = aqUp100((maj + min) / top.length); top.forEach(x => { out[x.pk] = each; roles[x.pk] = 'égalité au 1er rang'; }); }
  else {
    out[top[0].pk] = maj; roles[top[0].pk] = 'majoritaire';
    const rest = hold.filter(x => x.n < hold[0].n);
    if(!rest.length){ out[top[0].pk] += min; roles[top[0].pk] = 'seul actionnaire : les deux primes'; }
    else { const sec = rest.filter(x => x.n === rest[0].n), each = aqUp100(min / sec.length);
      sec.forEach(x => { out[x.pk] = (out[x.pk] || 0) + each; roles[x.pk] = sec.length > 1 ? 'minoritaire (égalité)' : 'minoritaire'; }); }

}

/* ---------- Commande vocale (jeu de dés) ---------- */
const VOICE_NUM = {un:1, une:1, uns:1, deux:2, trois:3, quatre:4, cinq:5, six:6};
function voiceAvailable(){ return !!((bridge && bridge.listen) || window.SpeechRecognition || window.webkitSpeechRecognition); }
function parseDiceSpeech(text){
  let t = String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const cmd = /encaiss/.test(t) ? 'bank' : (/\brate\b|\bfarkle\b|aucun de/.test(t) ? 'farkle' : (/ajout/.test(t) ? 'add' : (/effac|recommenc/.test(t) ? 'clear' : null)));
  t = t.replace(/[^a-z0-9 ]+/g, ' ').replace(/\b(et|plus|puis|avec)\b/g, ' | ');
  const groups = t.split('|').map(gp => {
    const out = [];
    gp.trim().split(/\s+/).forEach(w => {
      if(!w) return;
      if(VOICE_NUM[w]) out.push(VOICE_NUM[w]);
      else if(/^[1-6]+$/.test(w)) w.split('').forEach(d => out.push(+d));
      else if(/^\d+$/.test(w)) out.push(-1); // nombre impossible (0, 7, 8…)
    });
    return out;
  }).filter(gp => gp.length);
  if(groups.some(gp => gp.includes(-1))) return {dice: null, cmd};
  const dice = [];
  for(const gp of groups){
    if(gp.length === 2 && gp[0] >= 1){ for(let i = 0; i < gp[0]; i++) dice.push(gp[1]); }  // « trois cinq » = trois 5
    else gp.forEach(d => dice.push(d));                                                   // « un cinq cinq » = 1, 5, 5
  }
  if(dice.length > 6) return {dice: null, cmd};
  return {dice, cmd};
}
function voiceStart(){
  if(S.listening) return;
  if(bridge && bridge.listen){ S.listening = true; render(); bridge.listen(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return toast('Reconnaissance vocale non disponible ici');
  const rec = new SR(); rec.lang = 'fr-CA'; rec.maxAlternatives = 5; rec.interimResults = false;
  rec.onresult = e => { const alts = []; for(const a of e.results[0]) alts.push(a.transcript); window.onSpeech(JSON.stringify(alts)); };
  rec.onerror = e => window.onSpeechError(e.error === 'not-allowed' ? 'Autorisez le micro pour cette app' : (e.error === 'no-speech' ? 'Rien entendu' : 'Erreur du micro'));
  rec.onend = () => { if(S.listening){ S.listening = false; render(); } };
  S.listening = true; render();
  try{ rec.start(); }catch(e){ window.onSpeechError('Erreur du micro'); }
}
window.onSpeechError = msg => { S.listening = false; toast('🎤 ' + msg); render(); };
window.onSpeech = json => {
  S.listening = false;
  let alts = []; try{ alts = JSON.parse(json) || []; }catch(e){}
  if(S.view === 'ask') return askVoice(alts);
  const g = curGame(); if(!g || g.type !== 'farkle' || g.finished){ render(); return; }
  let pick = null, heard = alts[0] || '';
  for(const a of alts){ const r = parseDiceSpeech(a); if((r.dice && r.dice.length) || r.cmd){ pick = r; heard = a; break; } }
  S.heard = {text: heard, ok: !!pick};
  if(!pick){ render(); return; }
  if(pick.dice && pick.dice.length) S.dice = pick.dice;
  if(pick.cmd === 'clear'){ S.dice = []; render(); return; }
  if(pick.cmd === 'farkle' && !(pick.dice && pick.dice.length)){ S.heard.did = 'Raté'; return A.fkFarkle(); }
  if(pick.cmd === 'add' || pick.cmd === 'bank'){
    const c = [0,0,0,0,0,0,0]; (S.dice||[]).forEach(d => c[d]++);
    const sc = diceScore(c, g.opts.f);
    if(S.dice.length && !(S.dice.length === 6 && S.dice.every(d => d === S.dice[0])) && !sc.ok){ render(); return toast('Certains dés ne comptent pas : vérifiez'); }
    const cur = g.cur;
    if(S.dice.length) A.fkAddSel();
    if(pick.cmd === 'bank' && curGame().cur === cur && !curGame().finished && (S.turn||0) > 0) A.fkBank();
    return;
  }
  render();
};
function fkSix(v){
  const g = curGame(), p = g.players[g.cur];
  g.turns.push({pk:p.key, pts:0, raw:S.turn||0, win:true, note:`🎲 Six dés identiques${v?' ('+v+')':''} : victoire !`, t:Date.now()});
  g.winner = p.key; g.finished = true; g.updated = Date.now(); S.turn = 0; S.dice = []; save();
  toast('🎲 ' + p.name + ' gagne avec six dés identiques !'); go('results');
}
function fkAdd(pts){
  const g = curGame(), f = g.opts.f, p = g.players[g.cur];
  const tot = totals(g)[p.key], nt = (S.turn||0) + pts;
  if(isEntered(g, p.key) || tot + nt >= f.entry){
    if(tot + nt > f.target){
      g.turns.push({pk:p.key, pts:0, raw:nt, note:`Dépasse ${fmt(f.target)} (${fmt(tot + nt)}) : tour terminé, aucun point`, t:Date.now()});
      toast('⛔ ' + p.name + ' dépasserait ' + fmt(f.target) + ' : au suivant');
      return fkNext(g);
    }
  }
  S.turn = nt; S.dice = []; recordHist(); render();
}
function fkNext(g){ g.cur = (g.cur + 1) % g.players.length; S.turn = 0; S.dice = []; S.heard = null; g.updated = Date.now(); save(); render(); }

/* ---------- Graphique : évolution des scores ---------- */
function scoreSeries(g){
  // cumul par joueur : après chaque manche, ou après chacun de ses tours (jeu de dés)
  return g.players.map(p => {
    const pts = [0]; let c = 0;
    if(isTurnGame(g)) g.turns.forEach(x => { if(x.pk === p.key){ c += x.pts; pts.push(c); } });
    else g.rounds.forEach(r => { c += Number(r.s[p.key]) || 0; pts.push(c); });
    return {p, pts};
  });
}
function niceStep(range, n){ const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
let CH = {};
function chartHtml(g, id){
  const ser = scoreSeries(g); const n = Math.max(...ser.map(x => x.pts.length)) - 1;
  if(n < 1) return `<p class="hint">Le graphique apparaîtra après la première ${GAMES[g.type].round.toLowerCase()}.</p>`;
  const tgt = g.type === 'farkle' ? g.opts.f.target : (g.opts.target || 0);
  let lo = Math.min(0, ...ser.flatMap(x => x.pts)), hi = Math.max(0, ...ser.flatMap(x => x.pts));
  if(tgt && hi >= tgt * 0.6) hi = Math.max(hi, tgt);
  if(hi === lo) hi = lo + 10;
  const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 340, H = 210, L = 40, Rm = ser.length <= 4 ? 58 : 12, T = 10, B = 24;
  const x = i => L + (W - L - Rm) * (i / n), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let svg = '';
  for(let v = lo; v <= hi + 1e-9; v += step) svg += `<line class="grid" x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`;
  if(lo < 0) svg += `<line class="base" x1="${L}" x2="${W-Rm}" y1="${y(0)}" y2="${y(0)}"/>`;
  if(tgt && tgt <= hi) svg += `<line class="tgt" x1="${L}" x2="${W-Rm}" y1="${y(tgt)}" y2="${y(tgt)}"/><text class="ax" x="${L+4}" y="${y(tgt)-4}">objectif ${fmt(tgt)}</text>`;
  const xs = n <= 10 ? [...Array(n+1).keys()] : [0, ...[1,2,3,4].map(k => Math.round(n*k/4))];
  xs.forEach(i => { svg += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${i}</text>`; });
  ser.forEach(sr => { svg += `<polyline fill="none" stroke="${sr.p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${sr.pts.map((v,i) => x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
    const li = sr.pts.length - 1; svg += `<circle cx="${x(li)}" cy="${y(sr.pts[li])}" r="4" fill="${sr.p.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  if(ser.length <= 4){ // étiquettes directes en bout de ligne, décalées pour ne pas se chevaucher
    const ends = ser.map(sr => ({sr, yy: y(sr.pts[sr.pts.length-1]), xx: x(sr.pts.length-1)})).sort((a,b) => a.yy - b.yy);
    for(let i = 1; i < ends.length; i++) if(ends[i].yy - ends[i-1].yy < 13) ends[i].yy = ends[i-1].yy + 13;
    ends.forEach(e => { const nm = e.sr.p.team ? 'Équipe ' + e.sr.p.team : (e.sr.p.name.length > 8 ? e.sr.p.name.slice(0,7) + '.' : e.sr.p.name); svg += `<text class="lbl" x="${e.xx + 7}" y="${e.yy + 4}">${esc(nm)}</text>`; });
  }
  svg += `<line id="${id}-xh" class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>`;
  svg += `<rect data-chart="${id}" x="${L}" y="0" width="${W-L-Rm}" height="${H}" fill="transparent"/>`;
  CH[id] = {g, ser, n, L, W, Rm, H, x};
  const legend = ser.length >= 2 ? `<div class="legend">${ser.map(sr => `<span><i style="background:${sr.p.color}"></i>${esc(sr.p.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des scores par ${GAMES[g.type].round.toLowerCase()}">${svg}</svg><div class="ctip" id="${id}-tip" hidden></div></div>${legend}
    <p class="hint" style="margin-top:6px">Axe horizontal : ${isTurnGame(g) ? 'tours de chaque joueur' : GAMES[g.type].round.toLowerCase() + 's'}. Touchez le graphique pour voir les pointages.</p>`;
}
function chartHover(e){
  const rect = e.target.closest('rect[data-chart]'); if(!rect) return;
  const c = CH[rect.dataset.chart]; if(!c) return;
  const svg = rect.ownerSVGElement, bb = svg.getBoundingClientRect(), sx = (e.clientX - bb.left) * (c.W / bb.width);
  const i = Math.max(0, Math.min(c.n, Math.round((sx - c.L) / ((c.W - c.L - c.Rm) / c.n))));
  const xh = $(rect.dataset.chart + '-xh'); xh.setAttribute('x1', c.x(i)); xh.setAttribute('x2', c.x(i)); xh.setAttribute('visibility', 'visible');
  const tip = $(rect.dataset.chart + '-tip');
  const rows = c.ser.map(sr => ({sr, v: sr.pts[Math.min(i, sr.pts.length - 1)]})).sort((a,b) => isLow(c.g) ? a.v - b.v : b.v - a.v);
  tip.innerHTML = `<div class="h">${isTurnGame(c.g) ? 'Tour ' : GAMES[c.g.type].round + ' '}${i}</div>` + rows.map(r => `<div class="r"><i style="background:${r.sr.p.color}"></i><span>${esc(r.sr.p.name)}</span><b class="num-t">${fmt(r.v)}</b></div>`).join('');
  tip.hidden = false; const px = c.x(i) * bb.width / c.W;
  tip.style.left = Math.max(0, Math.min(bb.width - tip.offsetWidth, px + (px > bb.width / 2 ? -tip.offsetWidth - 10 : 10))) + 'px';
}
document.addEventListener('pointermove', chartHover);
document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerleave', e => { if(e.target.matches && e.target.matches('rect[data-chart]')){ const id = e.target.dataset.chart; $(id+'-tip').hidden = true; $(id+'-xh').setAttribute('visibility','hidden'); } }, true);

/* ---------- Statistiques ---------- */
function statKey(g){ return g.type === 'generic' ? 'generic:' + (g.title||'Pointage libre') : g.type; }
function statLabel(k){ return k.startsWith('generic:') ? k.slice(8) : GAMES[k].name; }
function statGames(){
  const per = S.statP || 'all', now = Date.now();
  const from = per === 'year' ? now - 365*864e5 : (per === 'month' ? now - 30*864e5 : 0);
  return db.games.filter(g => g.finished && (g.updated || g.created) >= from).sort((a,b) => a.created - b.created);
}
function pkey(name){ return String(name).trim().toLowerCase(); }
function computeStats(gs){
  const st = {};
  const get = p => { const k = pkey(p.name); return st[k] = st[k] || {name:p.name, color:p.color, n:0, w:0, seq:[], vs:{}, games:{}}; };
  gs.forEach(g => {
    const r = ranking(g).flatMap(x => membersOf(g, x.p).map(m => ({p: m, rank: x.rank}))), winners = r.filter(x => x.rank === 1).map(x => x.p);
    r.forEach(x => {
      const s1 = get(x.p), won = x.rank === 1, gk = statKey(g);
      s1.n++; if(won) s1.w++; s1.seq.push(won); s1.color = x.p.color;
      s1.games[gk] = s1.games[gk] || {n:0, w:0}; s1.games[gk].n++; if(won) s1.games[gk].w++;
      if(!won) winners.forEach(wp => { const k = pkey(wp.name); s1.vs[k] = (s1.vs[k] || 0) + 1; });
    });
  });
  Object.values(st).forEach(s1 => {
    let best = 0, run = 0; s1.seq.forEach(w => { run = w ? run + 1 : 0; best = Math.max(best, run); });
    let cur = 0; for(let i = s1.seq.length - 1; i >= 0 && s1.seq[i]; i--) cur++;
    s1.best = best; s1.cur = cur;
    const nem = Object.entries(s1.vs).sort((a,b) => b[1] - a[1])[0];
    s1.nemesis = nem ? {name: (st[nem[0]] || {name: nem[0]}).name, n: nem[1]} : null;
    const fav = Object.entries(s1.games).sort((a,b) => b[1].w - a[1].w || b[1].n - a[1].n)[0];
    s1.fav = fav && fav[1].w ? statLabel(fav[0]) : null;
  });
  return st;
}
function recordsFor(gs){
  if(!gs.length) return [];
  const g0 = gs[0], low = isLow(g0) && g0.type !== 'phase10';
  let bestWin = null, margin = null, longest = null;
  gs.forEach(g => {
    const r = ranking(g); const w = r[0], second = r.find(x => x.rank > 1);
    if(!(g.winner)){ const v = w.total; if(!bestWin || (low ? v < bestWin.v : v > bestWin.v)) bestWin = {v, who: w.p.name, g}; }
    if(second){ const m = Math.abs(w.total - second.total); if(!margin || m > margin.v) margin = {v: m, who: w.p.name, g}; }
    const len = isTurnGame(g) ? g.turns.length : g.rounds.length; if(!longest || len > longest.v) longest = {v: len, g};
  });
  const unit = isTurnGame(g0) ? 'tours' : GAMES[g0.type].round.toLowerCase() + 's';
  const out = [];
  if(bestWin) out.push([low ? 'Meilleur pointage gagnant (le plus bas)' : 'Meilleur pointage gagnant', fmt(bestWin.v), bestWin.who + ' · ' + dateFr(bestWin.g.created)]);
  if(margin) out.push(['Plus grande avance', fmt(margin.v) + ' pts', margin.who + ' · ' + dateFr(margin.g.created)]);
  if(longest) out.push(['Partie la plus longue', longest.v + ' ' + unit, dateFr(longest.g.created)]);
  const sixes = gs.filter(g => g.winner).length; if(sixes) out.push(['Victoires aux six dés identiques', String(sixes), '']);
  return out;
}
function vStats(){

  return `<header class="top"><div class="grow"><h1>Statistiques</h1><p class="sub">Qui gagne le plus ?</p></div></header>
  <main class="pad">
    <div class="seg" style="margin-bottom:10px">${[['all','Tout'],['year','12 mois'],['month','30 jours']].map(([v,l]) => `<button data-a="statP" data-v="${v}" class="${per===v?'on':''}">${l}</button>`).join('')}</div>

/* ---------- Mises à jour ---------- */
const canUpdate = () => !!(bridge && bridge.checkUpdate && bridge.installUpdate);
const appVersion = () => { try{ return bridge && bridge.getVersion ? bridge.getVersion() : (window.WEB_VERSION || ''); }catch(e){ return ''; } };
let UP = {state:'idle'};
function verParts(v){ return String(v||'').replace(/^v/i,'').split('.').map(n => parseInt(n,10)||0); }
function newer(a, b){ const x = verParts(a), y = verParts(b); for(let i=0;i<Math.max(x.length,y.length);i++){ const d = (x[i]||0) - (y[i]||0); if(d) return d > 0; } return false; }
function checkUpdates(quiet){
  if(!canUpdate()) return;
  UP = {state:'checking', quiet}; if(!quiet) render();
  try{ localStorage.setItem('pointage.lastCheck', String(Date.now())); }catch(e){}
  bridge.checkUpdate();
}
window.onUpdateInfo = text => {
  const quiet = UP.quiet;
  let rel = null; try{ rel = text ? JSON.parse(text) : null; }catch(e){}
  if(rel && rel.version && rel.apk && newer(rel.version, appVersion())){
    UP = {state:'available', latest: String(rel.version), notes: rel.notes || '', url: rel.apk, size: rel.size};
  } else UP = {state:'none'};
  if(!(quiet && UP.state === 'none')) render();
};
window.onUpdateProgress = pct => { UP.state = 'downloading'; UP.pct = pct; const b = $('upPct'); if(b){ b.style.width = pct + '%'; $('upTxt').textContent = pct < 100 ? 'Téléchargement… ' + pct + ' %' : 'Ouverture de l’installation…'; } else if(S.view === 'settings') render(); };
window.onUpdateError = msg => { const q = UP.quiet && UP.state === 'checking'; UP = Object.assign({}, UP, {state: q ? 'idle' : 'error', msg}); if(!q) render(); };
window.onUpdateNeedsPermission = () => { UP.state = 'perm'; render(); };
window.onUpdateDone = () => { UP = {state:'none'}; toast('Mise à jour installée'); render(); };

function skScore(c){
  let pts = 0; const gone = [];
  for(let col = 0; col < 4; col++){
    const a = c[col], b = c[col + 4], d = c[col + 8];
    if(a != null && a === b && b === d){ gone.push(col); continue; }
    [a, b, d].forEach(v => { if(v != null) pts += v; });
  }
  return {pts, gone};
}
function skRender(pk){
  const h = M.sk[pk], sc = skScore(h.c);
  $('skg-'+pk).innerHTML = h.c.map((v,i) => `<button class="p9c ${i===h.sel?'sel':''} ${v!=null?'f':''} ${sc.gone.includes(i % 4)?'m':''}" data-a="sks" data-k="${pk}" data-i="${i}">${v==null?'':(v<0?'−'+(-v):v)}</button>`).join('');
  const filled = h.c.filter(v => v != null).length;
  if(filled) $('in-'+pk).value = sc.pts;
  $('ske-'+pk).innerHTML = filled ? `${filled}/12 cartes${sc.gone.length ? ` · ${sc.gone.length} colonne${sc.gone.length>1?'s':''} retirée${sc.gone.length>1?'s':''}` : ''} = <b>${fmt(sc.pts)}</b>` : 'Touchez une carte, puis sa valeur. Une colonne de trois cartes identiques est retirée.';
}
function p9Score(c){
  let pts = 0; const matched = {}; const parts = [];
  for(let i = 0; i < 4; i++){
    const a = c[i], b = c[i+4];
    if(a != null && b != null && a === b){ const v = a === -5 ? -10 : 0; pts += v; matched[a] = (matched[a]||0) + 1; parts.push(a === -5 ? '−10' : '0'); }
    else { if(a != null){ pts += a; parts.push(String(a)); } if(b != null){ pts += b; parts.push(String(b)); } }
  }
  let bonus = 0; for(const k in matched) if(matched[k] >= 2) bonus -= 5 * matched[k];
  return {pts: pts + bonus, bonus, parts, matched};
}
function p9Render(pk){
  const h = M.p9[pk]; const sc = p9Score(h.c);
  const isM = i => { const col = i % 4; return h.c[col] != null && h.c[col] === h.c[col+4]; };
  $('p9g-'+pk).innerHTML = h.c.map((v,i) => `<button class="p9c ${i===h.sel?'sel':''} ${v!=null?'f':''} ${isM(i)?'m':''}" data-a="p9s" data-k="${pk}" data-i="${i}">${v==null?'':(v<0?'−5':v)}</button>`).join('');
  const filled = h.c.filter(v => v != null).length;
  if(filled) $('in-'+pk).value = sc.pts;
  $('p9e-'+pk).innerHTML = filled ? `${filled}/8 cartes · ${sc.parts.join(' + ').replace(/\+ -/g,'− ')}${sc.bonus?` · bonus ${fmt(sc.bonus)}`:''} = <b>${fmt(sc.pts)}</b>` : 'Touchez une carte, puis sa valeur. Les colonnes identiques s’annulent.';
}
function sbUpdate(){
  const g = curGame(); const w = (document.querySelector('input[name=sbw]:checked')||{}).value;
  let sum = 0;
  g.players.forEach(p => { const row = $('sbrow-'+p.key); if(row) row.style.display = p.key === w ? 'none' : ''; });
  document.querySelectorAll('#modal [data-sb]').forEach(i => { if(i.dataset.team !== w) sum += Math.max(0, num(i.value)); });
  $('sb-total').textContent = w ? fmt(25 + 5*sum) : '–';
}
function unoUpdate(){
  const g = curGame(); const w = (document.querySelector('input[name=unow]:checked')||{}).value; let sum = 0;
  g.players.forEach(p => { const row = $('unorow-'+p.key); if(row) row.style.display = p.key === w ? 'none' : ''; if(p.key !== w) sum += Math.max(0, num($('in-'+p.key).value)); });

function f7Update(pk){
  const h = M.f7[pk]; const v = f7Pts(h);
  $('in-'+pk).value = (h.nums.length || h.mods.length || h.bust || h.bonus) ? v : '';

  $('f7e-'+pk).innerHTML = h.bust ? 'Éliminé : 0 point' : (h.nums.length||h.mods.length ? `(${h.nums.join(' + ')||0})${h.x2?' × 2':''}${h.mods.map(m=>' + '+m).join('')}${h.bonus?' + 15':''} = <b>${v}</b>${dup?' <span class="neg">· doublon !</span>':''}` : 'Touchez les cartes du joueur.');
}
function saveRound(){
  const g = curGame(); const rd = {s:{}, m:{}};
  const isEmpty = g.type === 'millebornes' ? (pk => liveMbEmpty(M.mb[pk])) : (pk => { const i = $('in-' + pk); return !!i && i.value.trim() === ''; });
  if(M.round === null && liveWarn(liveMissing(g, isEmpty))) return;
  const liveMiss = g.share && M.round === null ? g.players.filter(p => isEmpty(p.key)).map(p => p.key) : [];
  if(g.type === 'millebornes'){
    g.players.forEach(p => { const m = Object.assign({}, M.mb[p.key]); m.km = mbKm(m); rd.m[p.key] = m; rd.s[p.key] = mbPts(m, mbOthers(p.key)); });
  } else if(g.type === 'uno' && g.opts.mode === 'official'){
    const w = (document.querySelector('input[name=unow]:checked')||{}).value;
    if(!w) return toast('Choisissez qui n’a plus de cartes');
    let sum = 0; rd.m = {w, left:{}};
    g.players.forEach(p => { if(p.key !== w){ const n = Math.max(0, num($('in-'+p.key).value)); rd.m.left[p.key] = n; sum += n; } });
    g.players.forEach(p => rd.s[p.key] = p.key === w ? sum : 0);
  } else if(g.type === 'skipbo'){
    const w = (document.querySelector('input[name=sbw]:checked')||{}).value;
    if(!w) return toast('Choisissez le gagnant de la manche');
    let sum = 0; rd.m = {w, left:{}};
    document.querySelectorAll('#modal [data-sb]').forEach(i => { if(i.dataset.team !== w){ const n = Math.max(0, num(i.value)); rd.m.left[i.id.slice(3)] = n; sum += n; } });
    g.players.forEach(p => rd.s[p.key] = p.key === w ? 25 + 5*sum : 0);
  } else {
    if(g.type === 'phase10' && M.round !== null) rd.m = g.rounds[M.round].m || {};
    g.players.forEach(p => { rd.s[p.key] = num($('in-'+p.key).value); });
    if(g.type === 'skyjo'){
      const fin = (document.querySelector('input[name=skfin]:checked')||{}).value;
      rd.m = {raw: Object.assign({}, rd.s), fin: fin || null};
      if(fin){ const v = rd.s[fin]; const lowestStrict = g.players.every(p => p.key === fin || rd.s[p.key] > v);
        if(v > 0 && !lowestStrict){ rd.s[fin] = v * 2; rd.m.doubled = true; toast('Pointage doublé pour ' + g.players.find(p => p.key === fin).name + ' : ' + v + ' × 2 = ' + (v * 2)); } }
    }
  }
  if(liveMiss.length){ rd.m = rd.m || {}; rd.m.miss = liveMiss; }
  if(M.round !== null) g.rounds[M.round] = rd; else g.rounds.push(rd);
  const isNew = M.round === null;
  g.updated = Date.now(); save(); closeModal(); render();
  const e = endInfo(g);
  if(e && !g.finished) toast('🏁 ' + e);
  else if(isNew && !(g.opts.holes && g.rounds.length >= g.opts.holes)) toast('🃏 À ' + dealerName(g) + ' de brasser' + (g.type === 'phase10' ? ' · avancez les marqueurs' : ''));
}

function hLev1(a, b){ // distance d'édition ≤ 1
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++d > 1) return false;
    if(a.length > b.length) i++; else if(b.length > a.length) j++; else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}
function hMatch(qt, set){

    if(s.length >= 5 && l.startsWith(s)) return 0.85;
    if(qt.length >= 6 && dt.length >= 6 && hLev1(qt, dt)) return 0.7;

}

function askVoice(alts){

// Le téléphone qui tient la feuille envoie la partie au relais, chiffrée (AES-GCM) avec une clé qui ne quitte jamais
// les téléphones : elle est dans le code QR, après le « # » du lien (jamais envoyé à un serveur). Les autres joueurs
// ouvrent le lien et suivent les pointages en lecture seule, mis à jour toutes les 3 secondes. Effacé du relais après 3 jours.
const LIVE_APP = 'https://rogerotisqc-spec.github.io/pointage/app/';
function b64u(bytes){ let s = ''; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function liveCrypto(){ return !!(window.crypto && crypto.subtle && crypto.getRandomValues); }
function liveOk(){ return aiConfigured() && liveCrypto(); }
const liveKey = k => crypto.subtle.importKey('raw', ub64u(k), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function liveEnc(k, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));

  return {iv: b64u(iv), data: b64u(new Uint8Array(ct))};
}
async function liveDec(k, iv, data){
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64u(iv)}, await liveKey(k), ub64u(data));
  return JSON.parse(new TextDecoder().decode(pt));

async function liveCall(path, body){
  const r = await fetch(AI_URL.replace(/\/$/, '') + '/live/' + path, { method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Token': aiToken() }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(d.error || ('Erreur ' + r.status)); e.status = r.status; e.gone = !!d.gone; throw e; }

}
function liveLink(sh){ return LIVE_APP + '#suivre=' + sh.id + '.' + sh.k; }

// Ce qui part vers les autres téléphones : la partie seulement (jamais le reste de vos données), sans les liens vers votre liste de joueurs
function liveSnap(g){
  const c = JSON.parse(JSON.stringify(g)); delete c.share;
  const clean = p => { delete p.rid; };
  c.players.forEach(clean); if(c.members) Object.values(c.members).forEach(ms => ms.forEach(clean));
  if(c.aq) delete c.aq.sh;   // Acquire : les actions de chacun restent secrètes

/* --- Côté hôte (le téléphone qui tient la feuille) --- */
let LIVE_T = null, LIVE_BUSY = false, LIVE_AGAIN = null;
function liveSoon(){ const g = curGame(); if(!g || !g.share || S.live) return; const id = g.id; clearTimeout(LIVE_T); LIVE_T = setTimeout(() => livePush(id).catch(() => {}), 600); }
async function livePush(id){
  const g = db.games.find(x => x.id === id); if(!g || !g.share) return;
  if(LIVE_BUSY){ LIVE_AGAIN = id; return; }
  LIVE_BUSY = true;
  try{
    const e = await liveEnc(g.share.k, liveSnap(g));
    await liveCall('put', {id: g.share.id, tok: g.share.tok, iv: e.iv, data: e.data});
    if(S.liveErr){ S.liveErr = ''; liveBar(); }
  }catch(e){
    S.liveErr = e.status === 503 ? String(e.message) : 'Pas de connexion : les autres verront les changements dès le retour d’Internet';
    liveBar(); clearTimeout(LIVE_T); LIVE_T = setTimeout(() => livePush(id).catch(() => {}), 10000);
    throw e;
  }finally{
    LIVE_BUSY = false;
    if(LIVE_AGAIN){ const a = LIVE_AGAIN; LIVE_AGAIN = null; livePush(a).catch(() => {}); }
  }

function liveBar(){ const b = $('livebar'); if(b) b.outerHTML = liveBarHtml(curGame()); }
function liveBarHtml(g){
  if(!g || !g.share) return '';
  return `<div class="livebar ${S.liveErr ? 'err' : ''}" id="livebar"><span class="dot"></span><span class="grow">${S.liveErr ? esc(S.liveErr) : 'Partie en direct : les autres joueurs suivent les pointages'}</span><button class="btn sm" data-a="liveShow">Code QR</button></div>`;
}
async function liveStart(){
  const g = curGame(); closeModal();
  if(!liveOk()) return toast('Le partage en direct n’est pas offert sur cet appareil');
  if(navigator.onLine === false) return toast('Il faut Internet pour partager la partie');
  const fresh = !g.share;
  if(fresh){ g.share = {id: liveRand(9), tok: liveRand(16), k: liveRand(16)}; g.liveId = g.share.id; save(); }
  toast('Préparation du partage…');
  try{ await livePush(g.id); }
  catch(e){ if(fresh && e.status === 503){ delete g.share; save(); S.liveErr = ''; render(); return toast(e.message); } }

function liveHere(L){ return db.games.some(x => !x.fromLive && ((L.gid && x.id === L.gid) || x.liveId === L.id)); }
function liveKeep(){
  const L = S.live, src = L && L.g; if(!src) return;
  if(liveHere(L)){ render(); return toast('✓ Cette partie est déjà dans votre historique'); }

/* ====================== Synchronisation de mes appareils ====================== */
// Les appareils d’une même personne se relient avec un code QR (#relier=ID.CLÉ). Chacun garde ses données ; le relais
// garde une copie chiffrée (la clé ne quitte jamais les appareils). Pour combiner, on compare trois états de chaque élément
// (partie, joueur, règle maison, préférence) : ce que cet appareil a, ce que le relais a, et ce qu’ils avaient en commun à la
// dernière synchro (empreintes dans pointage.syncb). Ce qui n’a changé que d’un côté est gardé ; si une même partie a
// changé des deux côtés, la plus récente l’emporte. Une partie supprimée d’un côté (et pas modifiée de l’autre) disparaît partout.
const SYNC_KEY = 'pointage.sync', SYNC_BASE = 'pointage.syncb', SYNC_SKIP = ['v', 'games', 'players', 'house'];
let SYNC_BUSY = false, SYNC_T = null, SYNC_SILENT = false, SYNC_ST = {last: 0, err: ''};
function syncCfg(){ try{ const c = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); return c && c.id && c.k ? c : null; }catch(e){ return null; } }
function syncCfgSet(c){ try{ if(c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
function syncBase(){ try{ const b = JSON.parse(localStorage.getItem(SYNC_BASE) || 'null'); return b && b.h ? b : {ver: 0, h: {}}; }catch(e){ return {ver: 0, h: {}}; } }
function syncBaseSet(b){ try{ if(b) localStorage.setItem(SYNC_BASE, JSON.stringify(b)); else localStorage.removeItem(SYNC_BASE); }catch(e){} }
function hash53(str){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }
// Empreinte stable (clés triées) : deux appareils qui ont la même chose donnent la même empreinte
function stable(v){ return Array.isArray(v) ? '[' + v.map(stable).join(',') + ']' : v && typeof v === 'object' ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}' : JSON.stringify(v === undefined ? null : v); }
const syncHash = v => hash53(stable(v));
function syncItems(d){
  const m = {};
  d.games.forEach(g => { const c = Object.assign({}, g); delete c.share; delete c.inbox; m['g:' + g.id] = c; });
  d.players.forEach(p => { m['p:' + p.id] = p; });
  m.porder = d.players.map(p => p.id);
  Object.keys(d.house || {}).forEach(k => { m['h:' + k] = d.house[k]; });
  Object.keys(d).forEach(k => { if(!SYNC_SKIP.includes(k) && d[k] !== undefined) m['f:' + k] = d[k]; });
  return m;
}
function syncHashes(m){ const h = {}; Object.keys(m).forEach(k => { h[k] = syncHash(m[k]); }); return h; }
function syncSame(a, b){ const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); }
function syncMerge(L, R, B){
  const M = {}, keys = new Set([...Object.keys(L), ...Object.keys(R), ...Object.keys(B)]);
  const lh = syncHashes(L), rh = syncHashes(R);
  keys.forEach(k => {
    if(k === 'porder') return;
    const l = k in L ? lh[k] : null, r = k in R ? rh[k] : null, b = k in B ? B[k] : null;
    let pick;
    if(l === r || r === b) pick = 'l';
    else if(l === b) pick = 'r';
    else if(l === null) pick = 'r';            // supprimé ici, modifié là-bas : on garde la version modifiée
    else if(r === null) pick = 'l';
    else if(k.startsWith('g:')) pick = (L[k].updated || 0) >= (R[k].updated || 0) ? 'l' : 'r';
    else pick = 'l';
    const src = pick === 'l' ? L : R; if(k in src) M[k] = JSON.parse(JSON.stringify(src[k]));
  });
  // ordre des joueurs : celui qui a changé, puis les nouveaux à la fin
  const lo = L.porder || [], ro = R.porder || [], bo = B.porder;
  const base = (bo && syncHash(lo) === bo) ? ro : lo;
  const order = [...new Set([...base, ...lo, ...ro])].filter(id => ('p:' + id) in M);
  // un même joueur créé sur deux appareils (même nom) : on n’en garde qu’un, et les parties pointent vers lui
  const seen = {}, remap = {};
  M.porder = order.filter(id => { const n = pkey(M['p:' + id].name); if(seen[n]){ remap[id] = seen[n]; delete M['p:' + id]; return false; } seen[n] = id; return true; });
  if(Object.keys(remap).length){
    Object.keys(M).filter(k => k.startsWith('g:')).forEach(k => { const g = M[k]; (g.players || []).forEach(p => { if(p.rid && remap[p.rid]) p.rid = remap[p.rid]; }); if(g.members) Object.values(g.members).forEach(ms => ms.forEach(p => { if(p.rid && remap[p.rid]) p.rid = remap[p.rid]; })); });
    if(M['f:lastSel']) Object.keys(M['f:lastSel']).forEach(t => { M['f:lastSel'][t] = [...new Set((M['f:lastSel'][t] || []).map(id => remap[id] || id))]; });
  }
  // une copie gardée depuis une partie en direct (fromLive) devient inutile quand la partie d’origine est là
  const orig = new Set(Object.keys(M).filter(k => k.startsWith('g:') && M[k].liveId && !M[k].fromLive).map(k => M[k].liveId));
  Object.keys(M).forEach(k => { if(k.startsWith('g:') && M[k].fromLive && orig.has(M[k].fromLive)) delete M[k]; });
  return M;
}
function syncApply(M){
  const old = db, nd = {v: old.v || 1, house: {}};
  nd.games = Object.keys(M).filter(k => k.startsWith('g:')).map(k => { const g = M[k], o = old.games.find(x => x.id === g.id); if(o){ if(o.share) g.share = o.share; if(o.inbox) g.inbox = o.inbox; } return g; });
  nd.players = (M.porder || []).map(id => M['p:' + id]).filter(Boolean);
  Object.keys(M).forEach(k => { if(k.startsWith('h:')) nd.house[k.slice(2)] = M[k]; else if(k.startsWith('f:')) nd[k.slice(2)] = M[k]; });
  db = Object.assign(defaultDb(), nd);
}
/* chiffrement (et compression quand le navigateur le permet) */
async function syncTok(k){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(k + ':ecrire')); return b64u(new Uint8Array(h)).slice(0, 22); }
async function zipBytes(u8, inflate){
  const cs = inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip');
  const out = new Response(new Blob([u8]).stream().pipeThrough(cs)); return new Uint8Array(await out.arrayBuffer());
}
async function syncEnc(k, obj){
  let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = '';
  if(window.CompressionStream){ try{ bytes = await zipBytes(bytes, false); z = 'z'; }catch(e){} }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await liveKey(k), bytes);
  return {iv: z + b64u(iv), data: b64u(new Uint8Array(ct))};
}
async function syncDec(k, iv, data){
  const z = iv[0] === 'z'; if(z) iv = iv.slice(1);
  let bytes = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64u(iv)}, await liveKey(k), ub64u(data)));
  if(z){ if(!window.DecompressionStream) throw new Error('Ce navigateur est trop ancien pour la synchronisation'); bytes = await zipBytes(bytes, true); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function syncCall(path, body){
  const r = await fetch(AI_URL.replace(/\/$/, '') + '/sync/' + path, { method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Token': aiToken() }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(d.error || ('Erreur ' + r.status)); e.status = r.status; e.d = d; throw e; }
  return d;
}
function syncSoon(ms){ if(!syncCfg()) return; clearTimeout(SYNC_T); SYNC_T = setTimeout(() => syncNow(false), ms == null ? 4000 : ms); }
async function syncNow(manual){
  const c = syncCfg(); if(!c || !liveCrypto() || !aiConfigured()) return false;
  if(SYNC_BUSY){ syncSoon(3000); return false; }
  const ae = document.activeElement;
  if(!manual && (M || (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.type !== 'checkbox') || S.turn || (S.dice || []).length)){ syncSoon(5000); return false; }
  if(navigator.onLine === false){ SYNC_ST.err = 'Pas de connexion Internet'; return false; }
  SYNC_BUSY = true; let ok = false, pulled = false;
  try{
    for(let attempt = 0; attempt < 4 && !ok; attempt++){
      const base = syncBase(), L = syncItems(db), lh = syncHashes(L);
      let d; try{ d = await syncCall('get', {id: c.id, ver: base.ver || 0}); }catch(e){ if(e.status === 404) d = {none: true}; else throw e; }
      let Mm, rh, rver;
      if(d.same){ Mm = L; rh = base.h; rver = d.ver; }
      else { const R = d.none ? {} : await syncDec(c.k, d.iv, d.data); rver = d.none ? 0 : d.ver; Mm = syncMerge(L, R, base.h || {}); rh = syncHashes(R); }
      const mh = syncHashes(Mm);
      if(!syncSame(lh, mh)){ syncApply(Mm); SYNC_SILENT = true; try{ save(); }finally{ SYNC_SILENT = false; } pulled = true; }
      if(syncSame(mh, rh)){ syncBaseSet({ver: rver, h: mh}); ok = true; break; }
      const e = await syncEnc(c.k, Mm);
      try{ const r = await syncCall('put', {id: c.id, tok: await syncTok(c.k), ver: rver, iv: e.iv, data: e.data}); syncBaseSet({ver: r.ver, h: mh}); ok = true; }
      catch(err){ if(err.status !== 409) throw err; }      // un autre appareil a écrit entre-temps : on recombine
    }
    SYNC_ST = {last: Date.now(), err: ok ? '' : 'Trop de changements en même temps : nouvel essai bientôt'};
    if(!ok) syncSoon(8000);
  }catch(e){ SYNC_ST.err = e.status === 503 ? String(e.message) : e.status === 403 ? 'Accès refusé par le relais' : 'Synchronisation impossible pour le moment'; syncSoon(30000); }
  finally{
    SYNC_BUSY = false;
    if(pulled && !M) render(); else if(S.view === 'settings' && !M) render();
  }
  return ok;
}

    return await new Promise((res, rej) => { fbWait[item.id] = {res, rej}; bridge.postIssue(item.id, FB_REPO, key, payload); setTimeout(() => { if(fbWait[item.id]){ delete fbWait[item.id]; rej(new Error('timeout')); } }, 30000); });
  }
  const r = await fetch(`https://api.github.com/repos/${FB_REPO}/issues`, {method:'POST', headers:{'Authorization':'Bearer ' + key, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, body: payload});
  if(!r.ok) throw new Error('http ' + r.status);
  return (await r.json()).number;
}
const fbWait = {};
window.onIssueResult = (id, ok, num) => { const w = fbWait[id]; if(!w) return; delete fbWait[id]; ok ? w.res(num) : w.rej(new Error(String(num))); };
let fbBusy = false;
async function fbFlush(quiet){
  if(fbBusy) return; const q = fbQueue(); if(!q.length) return;
  fbBusy = true; let sent = 0, last = null;
  while(q.length){
    try{ last = await fbPost(q[0]); q.shift(); fbSaveQueue(q); sent++; }
    catch(e){ break; }
  }
  fbBusy = false;
  if(sent && !quiet) toast(sent === 1 ? `Merci ! Rapport envoyé (n° ${last})` : `Merci ! ${sent} rapports envoyés`);
  else if(sent) toast(`${sent} rapport(s) en attente envoyé(s)`);
  if(!sent && !quiet) toast('Pas de connexion : le rapport sera envoyé plus tard');
  if(S.view === 'settings') render();
}
window.addEventListener('online', () => fbFlush(true));

  voiceCloud: () => { const on = vPref('cloud', '1') !== '1'; vSet('cloud', on ? '1' : '0'); speakStop(); render(); },

  scrCur: el => { const g = curGame(); if(g.finished) return; if(scrTurnTotal()) return toast('Validez ou passez le tour en cours d’abord'); g.cur = Number(el.dataset.i); S.scr = null; save(); render(); },
  scrMark: el => { const st = scrState(), i = Number(el.dataset.i); st.marks[i] = ((st.marks[i] || 0) + 1) % 4; render(); },

    const bon = letters.map((l,i) => ({1:l+'×2', 2:l+'×3', 3:l+' joker'})[st.marks[i]||0]).filter(Boolean);
    st.words.push({word: letters.join(''), pts, detail: [bon.join(', '), st.mult > 1 ? 'mot ×' + st.mult : ''].filter(Boolean).join(' · ') || 'sans bonus'});

  scrRmWord: el => { scrState().words.splice(Number(el.dataset.i), 1); render(); },
